<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your Avatar · {{ school_name }}</title>
  <link rel="stylesheet" href="/static/lloves.css">
  <link rel="stylesheet" href="/static/student-portal.css">
  {% include "_sentry_browser.html" %}
</head>
<body class="student-portal">
  <div class="student-wrap">
    <p class="kicker">{{ offering.ontario_code if offering else 'Course' }}</p>
    <h1>Choose your Avatar</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" id="character-form">
      <input type="hidden" name="visit_token" value="{{ visit_token or '' }}">
      <div class="char-grid" role="radiogroup" aria-label="Avatars">
        {% for avatar in characters %}
        <label class="char-card{% if avatar.earned %} is-earned{% endif %}" title="{{ avatar.label }}">
          <input type="radio" name="character" value="{{ avatar.key }}" required>
          {% if avatar.earned %}
          <img class="avatar-img" src="{{ avatar.img }}" alt="" width="72" height="72">
          <span class="visually-hidden">{{ avatar.label }}</span>
          <span class="tag-earned">Earned</span>
          {% else %}
          <span class="char-emoji" aria-hidden="true">{{ avatar.emoji }}</span>
          <span class="visually-hidden">{{ avatar.label }}</span>
          {% endif %}
        </label>
        {% endfor %}
      </div>
      {% if reward and reward.grants %}
      <button type="button" class="rw-slot" data-reward-open>Pick your reward</button>
      {% endif %}
      <div class="row-actions char-join">
        <button type="submit">Join Class</button>
      </div>
    </form>
  </div>
  <script src="/static/student-visit-token.js"></script>
  <script src="/static/student-live-session.js"></script>
  {% include "student/_avatar_reward.html" %}
</body>
</html>
