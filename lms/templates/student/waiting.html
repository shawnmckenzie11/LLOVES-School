<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waiting · {{ school_name }}</title>
  <link rel="stylesheet" href="/static/lloves.css">
  {% include "_sentry_browser.html" %}
</head>
<body>
  <div class="wrap">
    <p class="kicker">{{ offering.ontario_code if offering else 'Course' }}</p>
    <h1>Waiting for kickoff</h1>
    <p class="sub">Your teacher has not started the live game yet. This page will join when the game goes live.</p>
    <p class="hint">Later: options provided by your teacher. (Not in this version.)</p>
  </div>
  <script>
    let pollInFlight = false;
    /**
     * Watch for kickoff. A shed / busy body stays on this page.
     */
    async function poll() {
      if (pollInFlight) return;
      pollInFlight = true;
      try {
        const res = await fetch("/api/student/state");
        if (!res.ok) return;
        const data = await res.json();
        if (!data || data.retry || data.error === "state unavailable") return;
        if (data.redirect) location.href = data.redirect;
      } catch (err) {
        /* keep waiting */
      } finally {
        pollInFlight = false;
      }
    }
    setInterval(poll, 4000);
    poll();
  </script>
</body>
</html>
