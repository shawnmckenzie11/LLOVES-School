      - paragraph [ref=f6e11]: "You already know how stretching, flipping, and sliding change the graph of y = x^2. This lesson is about reading a quadratic written in vertex form:"
      - paragraph [ref=f6e12]: f(x) = a(x − h)^2 + k
      - paragraph [ref=f6e13]: That writing is useful because the vertex, the axis of symmetry, and whether the graph has a maximum or a minimum can be read from the equation — if you know how to look.
      - paragraph [ref=f6e14]: "Before you move anything, look at this equation:"
      - paragraph [ref=f6e15]: f(x) = (x + 3)^2 + 1
      - paragraph [ref=f6e16]: Name the vertex of this parabola. Write it as a point.
      - paragraph [ref=f6e17]: You will check on the graph tool in Action. Do not move the sliders yet.
