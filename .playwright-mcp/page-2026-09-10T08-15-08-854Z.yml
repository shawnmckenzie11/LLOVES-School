      - paragraph [ref=e21]: That turning point is the fact we will want from an equation of the curve. Vertex form makes the high or low point readable.
      - paragraph [ref=e22]: A quadratic written as
      - paragraph [ref=e23]: f(x) = a(x - h)² + k
      - paragraph [ref=e24]: "is in vertex form. The vertex is the point (h, k). The axis of symmetry is the vertical line x = h. The sign of a tells you whether that vertex is a maximum or a minimum: negative a opens downward, so the vertex is a highest point; positive a opens upward, so the vertex is a lowest point."
