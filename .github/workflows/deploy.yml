name: Deploy LLOVES LMS

# Push to main runs the LMS test suite immediately. The Production
# approval job then waits for review on `production`; once approved, the
# Deploy to Fly job runs flyctl deploy. The required reviewer is a repo
# setting (shawnmckenzie11), not this file.
#
# workflow_dispatch runs the same three jobs (test, approve, deploy).
# Only refs/heads/main gets past test: approve holds the production
# environment and runs the SHA guard; deploy needs approve from the same
# run attempt and re-runs the SHA guard before flyctl. Deploy itself has
# no environment.
# Feature branches never run this workflow; they test via ci.yml.
#
# Concurrency (MCK-126): only the newest run waits at the Production gate.
# Three jobs, three groups:
#   test    group deploy-lloves-lms-test-<ref>, cancel-in-progress true.
#           A newer run on the same ref cancels an older run still testing.
#   approve group deploy-lloves-lms-gate-<ref>, cancel-in-progress true.
#           Holds the production environment (required reviewer). A job
#           waiting for review occupies its concurrency group, so a newer
#           run's approve job cancels an older one still waiting.
#   deploy  group deploy-lloves-lms-fly, cancel-in-progress false.
#           No environment (approval already happened in approve). Runs
#           flyctl. Never cancelled by a newer run; a newer approved
#           deploy waits as pending (one pending slot, newest wins).
# The test and gate groups are separate so an older run's approve job
# can never cancel a newer run's tests.
# Backstops: the SHA guard refuses flyctl unless GITHUB_SHA is still
# origin/main, and deploy refuses unless approve ran in this run attempt
# (a "Re-run failed jobs" of deploy alone does not skip approval).
# Re-run only the newest run. Re-running an older run re-enters the gate
# group and cancels whatever newer run is waiting there; the SHA guard
# then fails the older one, leaving nothing to approve.
#
# Not a code deploy: attach-live-postgres.yml is workflow_dispatch only.
# It does not flyctl deploy. It can restart lloves-lms and waits on the
# same production environment.
#
# Repository secret FLY_API_TOKEN (Fly deploy token for app lloves-lms).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: LMS test suite
    runs-on: ubuntu-latest
    # A newer run on the same ref supersedes this one while it tests.
    concurrency:
      group: deploy-lloves-lms-test-${{ github.ref }}
      cancel-in-progress: true
    # Same Postgres the feature-branch suite uses (ci.yml). The N=28
    # Artifact load test dials LIVE_PRESENCE_TEST_URL, defaulting to
    # postgresql://lloves:lloves@127.0.0.1:5432/lloves_live, and fails
    # the job when CI is set and that server is down.
    # Do not export LIVE_DATABASE_URL or DATABASE_URL on this job.
    # Those attach Postgres to every create_app() that does not pass
    # live_database_url="", which would move the sqlite heartbeat bars
    # (#115–#117) off sqlite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lloves
          POSTGRES_PASSWORD: lloves
          POSTGRES_DB: lloves_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloves -d lloves_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      - name: Run tests
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
          LIVE_PRESENCE_TEST_URL: postgresql://lloves:lloves@127.0.0.1:5432/lloves_live
        run: python -m unittest discover -s lms -p 'test_*.py' -v

  approve:
    name: Production approval
    needs: test
    # workflow_dispatch can target any ref. Only main may request a
    # production review. A red test job skips this job, so approval
    # cannot ship a failed build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://alc.mckenzian.com
    # Only the newest run waits here. A newer run's approve job cancels
    # this one while it is waiting for review (or pending). Nothing in
    # this job touches Fly, so cancelling it is always safe.
    concurrency:
      group: deploy-lloves-lms-gate-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      attempt: ${{ steps.approved.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a stale main SHA
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tip="$(git rev-parse origin/main)"
          echo "This run:    ${GITHUB_SHA}"
          echo "origin/main: ${tip}"
          if [ "${GITHUB_SHA}" != "${tip}" ]; then
            echo "::error title=Stale deploy blocked::This run is ${GITHUB_SHA}, but origin/main is ${tip}. A newer merge landed while this deploy waited for review. Approve the newest green Deploy LLOVES LMS run instead."
            exit 1
          fi

      - name: Record the approved attempt
        id: approved
        run: echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Fly
    needs: approve
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One flyctl deploy at a time, and never cancelled by a newer run:
    # mid-deploy cancellation is unsafe. A newer approved run waits here
    # as pending; a still-newer one replaces it (queue single).
    concurrency:
      group: deploy-lloves-lms-fly
      cancel-in-progress: false
    steps:
      - name: Require approval in this run attempt
        env:
          APPROVED_ATTEMPT: ${{ needs.approve.outputs.attempt }}
        run: |
          set -euo pipefail
          if [ "${APPROVED_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error title=Approval not in this attempt::Production approval ran in attempt ${APPROVED_ATTEMPT}, this is attempt ${GITHUB_RUN_ATTEMPT}. Use Re-run all jobs so the deploy is approved again."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Refuse a stale main SHA
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tip="$(git rev-parse origin/main)"
          echo "This run:    ${GITHUB_SHA}"
          echo "origin/main: ${tip}"
          if [ "${GITHUB_SHA}" != "${tip}" ]; then
            echo "::error title=Stale deploy blocked::This run is ${GITHUB_SHA}, but origin/main is ${tip}. A newer merge landed while this deploy waited for review. Approve the newest green Deploy LLOVES LMS run instead."
            exit 1
          fi

      - name: Guard against dev login in production config
        run: |
          if grep -qE "^\s*LOCAL_DEV_LOGIN\s*=\s*['\"]?(1|true|yes)" fly.toml; then
            echo "LOCAL_DEV_LOGIN must never be enabled in fly.toml"
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --build-arg GH_SHA=${{ github.sha }}
