<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <description>Metric-compatible substitutes for Office faces used in slide decks</description>

  <!-- Named Office faces. The job fontconfig assigns these clones
       before /etc/fonts/fonts.conf, because this file alone loses to
       the system binding that prefers Arimo, Tinos, and Cousine.
       The aliases below still name the map, and the generic families
       are what an unknown face falls through to. -->
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Times</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Courier</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Cambria</family>
    <prefer><family>Caladea</family></prefer>
  </alias>

  <!-- Anything else that falls through to a generic family. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
