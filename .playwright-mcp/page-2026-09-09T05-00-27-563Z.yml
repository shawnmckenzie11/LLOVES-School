  - heading "1. Intended understanding" [level=2] [ref=f3e12]
  - paragraph [ref=f3e13]: A quadratic written as f(x) = a(x − h)^2 + k makes the vertex (h, k), the axis of symmetry, and the maximum or minimum readable from the equation; changing a, h, or k moves the graph in a way students can predict and then check. Expanding that vertex-form equation produces an equivalent standard form, which graphing technology confirms.
  - paragraph [ref=f3e14]: A2.7, A2.10
  - heading "2. Question candidates" [level=2] [ref=f3e15]
  - generic [ref=f3e16]:
    - generic [ref=f3e17]:
      - strong [ref=f3e18]: "diagnostic #1"
      - text: — Vertex of y = −2(x + 3)^2 + 5 (h-sign)
      - paragraph [ref=f3e19]: Look at y = −2(x + 3)^2 + 5. Name the vertex of this parabola.
      - paragraph [ref=f3e20]: Closest existing bank item to the brief’s h-sign case f(x) = (x + 3)^2 + 1. Students who read the written plus as a right shift place the vertex at (3, 5) instead of (−3, 5). Isolating the vertex ask keeps this on A2.10 inspection, not a new transformation lesson. · nelson_functions_11
    - generic [ref=f3e21]:
      - strong [ref=f3e22]: "diagnostic #2"
      - text: — Predict vertex of (x + 3)^2 + 1, then check sliders
      - paragraph [ref=f3e23]: Before you move anything, name the vertex of f(x) = (x + 3)^2 + 1. Then set the sliders so the graph matches that equation and check.
      - paragraph [ref=f3e24]: "Hits the brief’s exact h-sign example. Prediction before the sliders move separates “I read +3 as h = 3” from a later graph check. Fallback: locally bundled JSXGraph; do not require GeoGebra. · geogebra"
    - generic [ref=f3e25]:
      - strong [ref=f3e26]: "diagnostic #3"
      - text: "— Ministry A2.6 sample: vertex of −2(x + 1)^2"
      - paragraph [ref=f3e27]: Starting from y = x^2, sketch h(x) = −2(x + 1)^2. Where is the vertex? Does this graph have a maximum or a minimum?
      - paragraph [ref=f3e28]: Second Ministry plus-inside case. Exposes h-sign on (x + 1) and max-min-from-a (students may use the sign of k, which is 0 here). This is an A2.6 sample reused only for the misconception; do not treat sketching-by-transformation as a new M4 target. · ontario-seed
    - generic [ref=f3e29]:
      - strong [ref=f3e30]: "guided_example #1"
      - text: "— OpenStax worked reading: y = −3(x + 2)^2 + 4"
      - paragraph [ref=f3e31]: The equation is y = −3(x + 2)^2 + 4. Name the vertex, say whether the graph has a maximum or a minimum, and say how you knew.
      - paragraph [ref=f3e32]: Only selected source that already works the plus-inside reading (x + 2 means h = −2) and ties the sign of a to maximum versus minimum. Use as a semi-worked read-the-equation example, not as a transformation introduction. · openstax
    - generic [ref=f3e33]:
      - strong [ref=f3e34]: "guided_example #2"
      - text: "— MCF3M A2.7 sample: expand 3(x − 1)^2 + 4"
      - paragraph [ref=f3e35]: Given f(x) = 3(x − 1)^2 + 4, write the same function as ax^2 + bx + c. Use graphing technology to compare the two graphs.
      - paragraph [ref=f3e36]: "Verbatim Ministry sample for A2.7: expand vertex form and check that the graph does not change. Targets the expand-changes-graph misconception. Do not invent the expanded coefficients. · ontario-seed"
    - generic [ref=f3e37]:
