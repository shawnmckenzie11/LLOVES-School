      - paragraph [ref=f3e63]: A parabola goes through two points, one on each side of the y-axis, and never meets the x-axis. What can you say about where its highest or lowest point can sit? [Do not use the contest stem below as classroom copy. This rewrite is a situation-level prompt only; Shawn must accept or restem before it is student-facing.]
