<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose section · {{ school_name }}</title>
  <link rel="stylesheet" href="/static/lloves.css">
</head>
<body>
  <div class="wrap">
    <p class="kicker">More than one live game</p>
    <h1>Which section?</h1>
    <p class="sub">Two classes are live with the same course code. Pick your days/time, or type your Codename.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      {% for g in live %}
      <p>
        <button type="submit" name="class_id" value="{{ g.class_id }}">
          {{ g.course_code }} · {{ g.days }} · {{ g.time }}
        </button>
      </p>
      {% endfor %}
      <label class="field" for="codename">Or your Codename</label>
      <input id="codename" name="codename" autocomplete="off">
      <div class="row-actions" style="margin-top:0.75rem">
        <button type="submit">Join with Codename</button>
      </div>
    </form>
  </div>
</body>
</html>
