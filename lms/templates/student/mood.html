<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How are you feeling? · {{ school_name }}</title>
  <link rel="stylesheet" href="/static/lloves.css">
  <link rel="stylesheet" href="/static/student-portal.css">
</head>
<body class="student-portal">
  <div class="student-wrap">
    <p class="kicker">{{ offering.ontario_code if offering else 'Course' }}</p>
    <h1>How are you feeling?</h1>
    <p class="sub">Pick one face, then join class. Your teacher can see this next to your name.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form class="mood-form" method="post" id="mood-form">
      <div class="mood-row" role="radiogroup" aria-label="How are you feeling?">
        {% for mood in moods %}
        <label class="mood-btn mood-{{ mood.key }}">
          <input type="radio" name="mood" value="{{ mood.key }}" required>
          <span class="mood-face" aria-hidden="true">{% if mood.key == 'good' %}😊{% elif mood.key == 'ok' %}😐{% else %}😞{% endif %}</span>
          <span class="mood-label">{{ mood.label }}</span>
        </label>
        {% endfor %}
      </div>
      <div class="row-actions mood-join">
        <button type="submit">Join Class</button>
      </div>
    </form>
  </div>
  <script src="/static/student-live-session.js"></script>
</body>
</html>
