      - text: "— OpenStax: expand ½(x + 2)^2 − 3 and check a table"
      - paragraph [ref=f3e39]: "A graph looks like y = x^2 moved left 2 and down 3, then stretched by one-half: g(x) = (1/2)(x + 2)^2 − 3. Expand this to the ax^2 + bx + c form. Check a few points in a table to see that both writings give the same outputs."
      - paragraph [ref=f3e40]: "Second A2.7-shaped worked path: expand, then confirm with a table. Also rehearses h-sign on (x + 2). STAR+diagram if used as a wordless graph-to-equation example; the basketball/shooter follow-on on the same page is A3.3-ish and is not this pick. · openstax"
    - generic [ref=f3e41]:
      - strong [ref=f3e42]: "practice #1"
      - text: "— OpenStax verbal: advantage of this form"
      - paragraph [ref=f3e43]: This writing of a quadratic is f(x) = a(x − h)^2 + k. What can you read from it that is harder to see when the same function is written as ax^2 + bx + c?
      - paragraph [ref=f3e44]: "Verbal A2.10 inspection: what vertex form is for, without asking students to expand. Keep the OpenStax stem in the source field; do not say “standard form” to students without the Ontario naming note. · openstax"
