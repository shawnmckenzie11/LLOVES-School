<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="cts-title cts-desc">
  <title id="cts-title">Area picture for f(x) = x^2 + 6x + 5</title>
  <desc id="cts-desc">An x-squared square with three x-rectangles on its right and three x-rectangles below it. The corner that would complete the square is an empty three-by-three grid. Five unit squares sit to the right as the original constant.</desc>
  <rect width="640" height="380" fill="#faf8f5"/>

  <text x="320" y="32" text-anchor="middle" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-size="20" fill="#1c1917">f(x) = x<tspan baseline-shift="super" font-size="14">2</tspan> + 6x + 5</text>

  <rect x="48" y="64" width="144" height="144" fill="#f7f1e4" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="120" y="146" text-anchor="middle" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-size="28" fill="#1c1917">x<tspan baseline-shift="super" font-size="18">2</tspan></text>

  <g fill="#d7ebe9" stroke="#0b5f5c" stroke-width="1.5">
    <rect x="192" y="64" width="48" height="144"/>
    <rect x="240" y="64" width="48" height="144"/>
    <rect x="288" y="64" width="48" height="144"/>
  </g>
  <g fill="#0b5f5c" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-size="18" text-anchor="middle">
    <text x="216" y="146">x</text>
    <text x="264" y="146">x</text>
    <text x="312" y="146">x</text>
  </g>

  <g fill="#d7ebe9" stroke="#0b5f5c" stroke-width="1.5">
    <rect x="48" y="208" width="144" height="48"/>
    <rect x="48" y="256" width="144" height="48"/>
    <rect x="48" y="304" width="144" height="48"/>
  </g>
  <g fill="#0b5f5c" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-size="18" text-anchor="middle">
    <text x="120" y="238">x</text>
    <text x="120" y="286">x</text>
    <text x="120" y="334">x</text>
  </g>

  <g fill="#f3f8f7" stroke="#0b5f5c" stroke-width="1.25" stroke-dasharray="5 4">
    <rect x="192" y="208" width="48" height="48"/>
    <rect x="240" y="208" width="48" height="48"/>
    <rect x="288" y="208" width="48" height="48"/>
    <rect x="192" y="256" width="48" height="48"/>
    <rect x="240" y="256" width="48" height="48"/>
    <rect x="288" y="256" width="48" height="48"/>
    <rect x="192" y="304" width="48" height="48"/>
    <rect x="240" y="304" width="48" height="48"/>
    <rect x="288" y="304" width="48" height="48"/>
  </g>
  <rect x="192" y="208" width="144" height="144" fill="none" stroke="#0b5f5c" stroke-width="2" stroke-dasharray="7 5"/>

  <g fill="#fef4e6" stroke="#c2410c" stroke-width="1.25">
    <rect x="424" y="88" width="48" height="48"/>
    <rect x="480" y="88" width="48" height="48"/>
    <rect x="536" y="88" width="48" height="48"/>
    <rect x="452" y="144" width="48" height="48"/>
    <rect x="508" y="144" width="48" height="48"/>
  </g>
  <g fill="#7c2d12" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-size="16" text-anchor="middle">
    <text x="448" y="118">1</text>
    <text x="504" y="118">1</text>
    <text x="560" y="118">1</text>
    <text x="476" y="174">1</text>
    <text x="532" y="174">1</text>
  </g>
  <text x="506" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#57534e">+5</text>
</svg>
