    - generic [ref=e142]:
      - paragraph [ref=e143]: A fresh case. Here is a new equation. Do not move the sliders yet.
      - paragraph [ref=e144]: f(x) = −0.5(x − 2)^2 + 4
      - paragraph [ref=e145]: Name the vertex, the axis of symmetry, and whether this is a maximum or a minimum. Then move one parameter to check.
      - paragraph [ref=e146]: "If you are on paper: sketch from the equation, then change one of a, h, or k and sketch again."
      - paragraph [ref=e147]: What to remember
      - paragraph [ref=e148]: "Vertex form is f(x) = a(x − h)^2 + k. You can read the vertex (h, k), the axis of symmetry x = h, and whether the graph has a maximum or a minimum from the sign of a: negative a means a maximum; positive a means a minimum."
      - paragraph [ref=e149]: Match the brackets to (x − h). A plus inside the brackets does not mean the vertex is on the positive side of the x-axis.
      - paragraph [ref=e150]: a stretches or flips the graph. k moves the vertex up or down. Those two jobs are not the same.
      - paragraph [ref=e151]: Expanding vertex form into f(x) = ax^2 + bx + c gives the same parabola, not a new one. The graphs should land on top of each other.
      - paragraph [ref=e152]: Vertex form does not make the x-intercepts as obvious as factored form. Do not treat the vertex as an intercept unless it actually sits on an axis.
      - paragraph [ref=e153]: You do not need to complete the square in this lesson.
