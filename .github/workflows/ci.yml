name: CI

# Tests only. A pull request runs on pull_request (opened, synchronize,
# reopened). A push runs only for main. Title and body edits do not run
# this workflow. production is tested by deploy.yml.
# One run per ref: a newer push cancels the in-progress run for that ref.
#
# The LMS suite is four shards. The job named "LMS test suite" is the
# aggregate: it is green only when all four shards are green. That is the
# check name branch protection requires. test_fanout_guard.py is not in
# the shards; the fan-out guard job runs it.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.gate.outputs.heavy }}
      lms: ${{ steps.gate.outputs.lms }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      # Copy-only pull requests set heavy=false. Push to main, a failed
      # diff, and any path outside the safe globs set heavy=true.
      # lms=true when any path is under lms/, and on push or a failed diff.
      # Globs: .github/scripts/ci_path_class.py
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ] || [ ! -f .github/scripts/ci_path_class.py ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "lms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/ci_path_class.py || {
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "lms=true" >> "$GITHUB_OUTPUT"
          }

  test-shard:
    name: LMS tests shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Keep this Postgres block identical to the shard job in deploy.yml.
    # N=28 dials LIVE_PRESENCE_TEST_URL (not LIVE_DATABASE_URL). Do not
    # export LIVE_DATABASE_URL or DATABASE_URL: those attach Postgres to
    # every create_app() and move the sqlite heartbeat bars off sqlite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lloves
          POSTGRES_PASSWORD: lloves
          POSTGRES_DB: lloves_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloves -d lloves_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Plan shard
        id: plan
        run: python3 .github/scripts/lms_test_shards.py plan --shard ${{ matrix.shard }} --shards 4

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      # MCK-470: a DNS failure must not hang or fail this job. The script
      # skips when soffice is already installed. A failed install does not
      # fail the job. Slide tests skip when soffice or the metric fonts
      # are missing. Shards that do not convert slides skip this step.
      - name: Install LibreOffice
        if: steps.plan.outputs.soffice == 'true'
        timeout-minutes: 12
        continue-on-error: true
        run: bash .github/scripts/install_libreoffice.sh

      # Slide conversion uses unshare --map-root-user. Ubuntu 24.04 denies
      # that write to uid_map until this restriction is off.
      - name: Allow the slide sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.chrome == 'true'
        with:
          node-version: "20"

      - name: Install Chrome for slide e2e
        if: steps.plan.outputs.chrome == 'true'
        run: |
          set -euo pipefail
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          npm install --prefix "${GITHUB_WORKSPACE}" playwright-core@1.49.1

      - name: Run tests
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
          LIVE_PRESENCE_TEST_URL: postgresql://lloves:lloves@127.0.0.1:5432/lloves_live
        timeout-minutes: 20
        run: timeout -s ABRT 18m python -X faulthandler .github/scripts/lms_test_shards.py run --shard ${{ matrix.shard }} --shards 4 --timings shard-timings.json

      - name: Upload shard timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lms-shard-timings-${{ matrix.shard }}
          path: shard-timings.json
          if-no-files-found: warn
          retention-days: 14

  test:
    name: LMS test suite
    needs: [classify, test-shard]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download shard timings
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: lms-shard-timings-*
          path: timings

      - name: Aggregate shards
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
          LMS_TOUCHED: ${{ needs.classify.outputs.lms }}
          TIMINGS_DIR: timings
        run: python3 .github/scripts/lms_test_shards.py aggregate

  fanout-guard:
    name: fan-out guard
    needs: classify
    # Copy-only pull requests skip this job. Push to main always runs it.
    # A missing classification runs it. Live-class state always matches a
    # heavy glob, so this job and the 30-seat load still run.
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify.outputs.heavy != 'false') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      - name: Fan-out guard
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
        timeout-minutes: 15
        run: python -m unittest discover -s lms -p 'test_fanout_guard.py' -v

  load-budget:
    name: 30-seat load budget
    needs: classify
    # Same gate as fan-out guard. Main and any non-copy diff run the budget.
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify.outputs.heavy != 'false') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      - name: 30-seat load budget
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
        timeout-minutes: 15
        run: python scripts/load_class.py --sqlite-budget --students 30 --out lc-qa/load-budget

  slide-load:
    name: slide forward load
    needs: classify
    # Same gate as fan-out guard. Main and any non-copy diff run this load.
    # No retry. state_p95_ms stays under 800 ms. A 599 retry belongs only
    # on the deploy 30-seat load smoke.
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify.outputs.heavy != 'false') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lloves
          POSTGRES_PASSWORD: lloves
          POSTGRES_DB: lloves_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloves -d lloves_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt psutil

      - name: Slide forward load
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python3 scripts/load_class.py \
            --minutes 1 \
            --classes 2 \
            --students 15 \
            --items 2 \
            --round-minutes 0.25 \
            --slide-forward \
            --cpu-quota 100 \
            --gate \
            --min-classes 2 \
            --presence-url "postgresql://lloves:lloves@127.0.0.1:5432/lloves_live" \
            --out "${RUNNER_TEMP}/slide-forward"
