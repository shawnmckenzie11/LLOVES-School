      - paragraph [ref=e440]: How did you read the high or low point from this equation? If you expanded it into ax² + bx + c, would the fountain-shaped curve move?
      - paragraph [ref=e441]: "If you are on paper: sketch from the equation, then change one of a, h, or k and sketch again."
      - heading "A high point from a given model" [level=2] [ref=e442]
      - paragraph [ref=e443]: You just read a high point from an equation of a path like the stream. These next models are already in vertex form.
      - paragraph [ref=e446]: A ball’s height in metres is modelled by h(t) = -4.9(t - 1.2)² + 8 on the flight interval. What is the maximum height, and when does it occur? What in the equation told you?
      - paragraph [ref=e449]: A water stream is modelled by h(x) = -0.5(x - 2)² + 4 for horizontal distance x in metres and height h in metres. The nozzle is at x = 0 and the water lands at h = 0. Determine the vertex. Then state a meaningful domain for this model and say where the equation should not be trusted as a description of the stream.
      - heading "What vertex form gives you" [level=2] [ref=e450]
      - paragraph [ref=e451]: Vertex form f(x) = a(x - h)² + k makes the vertex (h, k) and the axis x = h readable. Maximum versus minimum comes from the sign of a, not from the sign of k and not from which quadrant the vertex sits in.
      - paragraph [ref=e452]: Match the brackets to (x - h). A plus inside the brackets does not mean the vertex is on the positive side of the x-axis.
      - paragraph [ref=e453]: a stretches or flips the graph. k moves the vertex up or down. Those two jobs are not the same.
      - paragraph [ref=e454]: Expanding vertex form into f(x) = ax² + bx + c gives the same parabola, not a new one. The graphs should land on top of each other.
