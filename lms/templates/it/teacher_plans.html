<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher plans · {{ school_name }}</title>
  <link rel="stylesheet" href="/static/staff-shell.css">
  <link rel="stylesheet" href="/static/it-teacher-plans.css">
  {% include "_sentry_browser.html" %}
</head>
<body class="staff-shell it-teacher-plans">
  <nav class="staff-top-menu" aria-label="Staff navigation">
    <a class="staff-top-btn" href="{{ url_for('staff_home') }}">Dashboard</a>
    <a class="staff-top-btn" href="{{ url_for('it_dashboard') }}">Admin</a>
    <span class="staff-top-btn on">Teacher plans</span>
    <span class="staff-top-spacer"></span>
    <a class="staff-top-link" href="{{ url_for('logout') }}">Log out</a>
  </nav>

  <div
    id="it-teacher-plans-root"
    class="it-tp-shell"
    data-school="{{ school_name }}"
    data-labels='{{ {
      "catchup_full": "Catch-up (all classes)",
      "slides_import": "Import Google Slides or PowerPoint",
      "whiteboard": "Whiteboards",
      "media": "Media",
      "team_draw": "Team draw",
      "group_draw": "Group draw",
      "portfolio_gdoc": "Portfolio to Google Doc",
      "news_wire_extras": "News wire extras",
      "mc_questions": "Multiple choice",
      "rank_questions": "Ranking",
      "numeric_questions": "Numeric",
      "essay_questions": "Written response",
      "live_slides": "Live slides",
      "catchup_links": "Catch-up (last class)",
      "celebrations": "Celebrations",
      "gradebook_tracking": "Attendance & participation",
      "game_show": "Rank game show",
      "whiteboard_submit": "Show Your Work"
    } | tojson }}'
    data-registry='{{ feature_registry | tojson }}'
  >
    <div class="it-tp-head">
      <div>
        <p class="it-tp-kicker">Admin</p>
        <h1 class="it-tp-title">Teacher plans</h1>
      </div>
      <div class="it-tp-tabs" role="tablist">
        <button type="button" class="it-tp-tab on" data-tab="teachers" aria-selected="true">Teachers</button>
        <button type="button" class="it-tp-tab" data-tab="plans" aria-selected="false">Plans</button>
        <button type="button" class="it-tp-tab" data-tab="audit" aria-selected="false">Audit</button>
      </div>
    </div>

    <div data-pane="teachers">
      <p class="it-tp-banner is-error" data-bulk-banner hidden role="alert"></p>
      <div class="it-tp-toolbar">
        <input class="it-tp-search" type="search" data-search placeholder="Search teachers" autocomplete="off">
        <select class="it-tp-filter" data-plan-filter aria-label="Plan">
          <option value="all">All plans</option>
          <option value="basic">Basic</option>
          <option value="pro">Pro</option>
        </select>
        <select class="it-tp-filter" data-bulk-target-plan aria-label="Bulk plan">
          <option value="pro">Pro</option>
          <option value="basic">Basic</option>
        </select>
        <button type="button" class="it-tp-btn" data-bulk-plan disabled>Set plan for 0 teachers</button>
      </div>
      <div class="it-tp-stage" data-stage>
        <div class="it-tp-table-pane" style="flex:1;display:flex;flex-direction:column;min-width:0">
          <p class="it-tp-loading" data-teachers-loading>Loading teachers…</p>
          <p class="it-tp-empty" data-teachers-empty hidden></p>
          <div class="it-tp-table-wrap">
            <table class="it-tp-data">
              <thead>
                <tr>
                  <th class="it-tp-checkcol"><input type="checkbox" data-select-all aria-label="Select all"></th>
                  <th>Teacher</th>
                  <th>School</th>
                  <th>Plan</th>
                  <th>Overrides</th>
                  <th>Last changed</th>
                </tr>
              </thead>
              <tbody data-teachers-body></tbody>
            </table>
          </div>
        </div>
        <aside class="it-tp-drawer" data-drawer hidden aria-label="Change history">
          <div class="drawer-head" style="display:flex;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid #d5dde6">
            <div>
              <h2 style="margin:0;font-size:1.05rem">Change history</h2>
              <p data-drawer-subtitle style="margin:4px 0 0;color:#64748b;font-size:.85rem"></p>
            </div>
            <button type="button" data-drawer-close aria-label="Close" style="border:0;background:transparent;font-size:1.2rem;cursor:pointer">×</button>
          </div>
          <div class="history" data-drawer-body></div>
        </aside>
      </div>
    </div>

    <div data-pane="plans" hidden>
      <div class="it-tp-table-wrap">
        <table class="it-tp-compare">
          <thead>
            <tr>
              <th>Feature</th>
              <th class="col-plan">Basic</th>
              <th class="col-plan">Pro</th>
            </tr>
          </thead>
          <tbody data-plans-body></tbody>
        </table>
      </div>
    </div>

    <div data-pane="audit" hidden>
      <div class="it-tp-toolbar audit-filters">
        <span class="filter-label">Teacher</span>
        <select class="it-tp-filter" data-audit-teacher aria-label="Teacher">
          <option value="">All teachers</option>
        </select>
        <span class="filter-label">Feature</span>
        <select class="it-tp-filter" data-audit-feature aria-label="Feature">
          <option value="">All features</option>
          <option value="plan">Plan</option>
          {% for row in feature_registry %}
          <option value="{{ row.key }}">{{ row.label }}</option>
          {% endfor %}
        </select>
        <span class="filter-label">From</span>
        <input class="it-tp-filter" type="date" data-audit-from aria-label="From date">
        <span class="filter-label">To</span>
        <input class="it-tp-filter" type="date" data-audit-to aria-label="To date">
      </div>
      <div class="it-tp-table-wrap">
        <table class="it-tp-data">
          <thead>
            <tr>
              <th>When</th>
              <th>Teacher</th>
              <th>Who</th>
              <th>What</th>
              <th>Change</th>
            </tr>
          </thead>
          <tbody data-audit-body></tbody>
        </table>
      </div>
    </div>

    <div data-toast-host></div>
    <div data-confirm-host></div>
  </div>

  <script src="/static/it_teacher_plans.js" defer></script>
</body>
</html>
