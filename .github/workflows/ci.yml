name: CI

# Tests only. Runs on feature branches and pull requests so work in progress
# gets feedback without touching the live site. Deploys live in deploy.yml.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    name: LMS test suite
    runs-on: ubuntu-latest
    # Keep this Postgres block identical to the test job in deploy.yml.
    # N=28 dials LIVE_PRESENCE_TEST_URL (not LIVE_DATABASE_URL). Do not
    # export LIVE_DATABASE_URL or DATABASE_URL: those attach Postgres to
    # every create_app() and move the sqlite heartbeat bars off sqlite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lloves
          POSTGRES_PASSWORD: lloves
          POSTGRES_DB: lloves_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloves -d lloves_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      - name: Run tests
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
          LIVE_PRESENCE_TEST_URL: postgresql://lloves:lloves@127.0.0.1:5432/lloves_live
        run: python -m unittest discover -s lms -p 'test_*.py' -v
