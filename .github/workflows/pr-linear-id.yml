name: Require Linear ID

# opened, synchronize, and reopened always check the title and body.
# edited runs the check only when the title or body changed, so a base-branch
# edit does not. CI (ci.yml) does not list edited, so a title or body edit
# does not start the test suite.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linear-id-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-linear-id:
    if: >-
      github.event.action != 'edited'
      || contains(toJSON(github.event.changes), '"title"')
      || contains(toJSON(github.event.changes), '"body"')
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Require an MCK Linear ID
        shell: bash
        run: |
          set -euo pipefail
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -qE 'MCK-[0-9]+'; then
            echo "Found a Linear ID in the pull request title or body."
          else
            echo '::error::The pull request title or body must contain a Linear ID matching MCK-[0-9]+.'
            exit 1
          fi

      # MCK-182: teachers read these lines in What's new after the deploy.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Require a What's new line (or none)
        run: python3 .github/scripts/whats_new.py check
