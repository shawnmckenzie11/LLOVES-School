name: Deploy LLOVES LMS

# A push to main does not deploy. Merge to main, then fast-forward production to ship.
#
# Push to production runs the LMS test suite, then the 30-seat load smoke.
# Deploy to Fly is the one production-environment approval: Shawn clicks
# once, and that same job runs the SHA guard and flyctl deploy. The
# required reviewer is a repo setting (shawnmckenzie11), not this file.
#
# workflow_dispatch runs the same three jobs (test, load-smoke, deploy).
# Only refs/heads/production gets past test. A red test or a red load
# smoke skips deploy, so flyctl does not run. The load smoke runs on the
# CI runner against 127.0.0.1. It never calls flyctl and never receives
# FLY_API_TOKEN.
# Feature branches never run this workflow; they test via ci.yml.
#
# Concurrency (MCK-126):
#   test   group deploy-lloves-lms-test-<ref>, cancel-in-progress true.
#          A newer run on the same ref cancels an older run still testing.
#   smoke  group deploy-lloves-lms-smoke-<ref>, cancel-in-progress true.
#          MCK-44. Local 30-seat gunicorn (two classes). A newer run
#          cancels an older smoke. Nothing here touches Fly.
#   deploy group deploy-lloves-lms-fly, cancel-in-progress false.
#          The only production-environment approval, so FLY_API_TOKEN is
#          read here. One click, then flyctl. Never cancelled by a newer
#          run; a newer deploy waits as pending (one pending slot).
# The test group is separate so a deploy wait cannot cancel a newer test.
# The SHA guard refuses flyctl unless GITHUB_SHA is still origin/production.
# Re-running Deploy to Fly asks for the production review again.
#
# Not a code deploy: attach-live-postgres.yml is workflow_dispatch only.
# It does not flyctl deploy. It can restart lloves-lms and waits on the
# same production environment.
#
# FLY_API_TOKEN is the Fly deploy token for app lloves-lms. The deploy job
# names the production environment, so it reads the token from that
# environment when the secret is set there, and from the repository secret
# until then.
on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      override_class_hours:
        description: "Deploy even during a live class window (MCK-231). The one Fly machine is replaced; students drop for ~30 s."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: LMS test suite
    runs-on: ubuntu-latest
    # pull-requests/actions: read for the What's new preview (MCK-182).
    permissions:
      contents: read
      pull-requests: read
      actions: read
    # A newer run on the same ref supersedes this one while it tests.
    concurrency:
      group: deploy-lloves-lms-test-${{ github.ref }}
      cancel-in-progress: true
    # Same Postgres the feature-branch suite uses (ci.yml). The N=28
    # Artifact load test dials LIVE_PRESENCE_TEST_URL, defaulting to
    # postgresql://lloves:lloves@127.0.0.1:5432/lloves_live, and fails
    # the job when CI is set and that server is down.
    # Do not export LIVE_DATABASE_URL or DATABASE_URL on this job.
    # Those attach Postgres to every create_app() that does not pass
    # live_database_url="", which would move the sqlite heartbeat bars
    # (#115–#117) off sqlite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lloves
          POSTGRES_PASSWORD: lloves
          POSTGRES_DB: lloves_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloves -d lloves_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # MCK-182: show this deploy's What's new lines on the run summary, so
      # they can be read before the production approval. Never fails the job.
      - name: Preview What's new
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/whats_new.py build --out "${RUNNER_TEMP}/releases.preview.json"

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea

      # Slide conversion uses unshare --map-root-user. Ubuntu 24.04 denies
      # that write to uid_map until this restriction is off.
      - name: Allow the slide sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
          LIVE_PRESENCE_TEST_URL: postgresql://lloves:lloves@127.0.0.1:5432/lloves_live
        # MCK-52: a hang aborts with every thread's stack in the log instead of
        # sitting in_progress for hours.
        timeout-minutes: 30
        run: timeout -s ABRT 25m python -X faulthandler -m unittest discover -s lms -p 'test_*.py' -v

  load-smoke:
    name: 30-seat load smoke
    needs: test
    # A red test skips this job. production only, same as deploy. The
    # gunicorn process is on this runner. It does not deploy.
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: deploy-lloves-lms-smoke-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lloves
          POSTGRES_PASSWORD: lloves
          POSTGRES_DB: lloves_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloves -d lloves_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # psutil is the sampler only. It is not an LMS runtime dependency.
        run: python -m pip install -r lms/requirements.txt psutil

      - name: 30-seat two-class smoke
        timeout-minutes: 8
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
        # 15 students × 2 classes = 30 seats on one local gunicorn.
        # --gate requires 0 errors, HTTP p95 < 400 ms, 0 worker restarts.
        # 400 ms (not 250) leaves margin for shared runners.
        run: |
          set -euo pipefail
          python3 scripts/load_class.py \
            --minutes 1 \
            --classes 2 \
            --students 15 \
            --items 2 \
            --round-minutes 10 \
            --gate \
            --max-p95-ms 400 \
            --min-classes 2 \
            --presence-url "postgresql://lloves:lloves@127.0.0.1:5432/lloves_live" \
            --out "${RUNNER_TEMP}/load-smoke"

      - name: Drop load smoke databases
        # load_class.py drops its db on exit; this catches a killed run.
        if: always()
        env:
          PGPASSWORD: lloves
        run: |
          for db in $(psql -h 127.0.0.1 -U lloves -d lloves_live -Atc "SELECT datname FROM pg_database WHERE datname LIKE 'load\_%'"); do
            psql -h 127.0.0.1 -U lloves -d lloves_live -c "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE)"
          done

      - name: Upload load smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/load-smoke
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy to Fly
    needs: load-smoke
    # workflow_dispatch can target any ref. Only production may request a
    # production review. A red test or a red load smoke skips this job, so
    # approval cannot ship a failed build.
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    # pull-requests/actions: read so What's new can read merged PRs and
    # past Deploy runs (MCK-182). Nothing here writes to the repo.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    # One flyctl deploy at a time, and never cancelled by a newer run:
    # mid-deploy cancellation is unsafe. A newer run waits here as pending;
    # a still-newer one replaces it (queue single).
    # This is the only production-environment approval. GitHub waits for
    # the required reviewer before any step, then this job deploys.
    # FLY_API_TOKEN is the environment secret once it is added there.
    # A re-run asks for that review again.
    environment:
      name: production
      url: https://alc.mckenzian.com
    concurrency:
      group: deploy-lloves-lms-fly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a stale production SHA
        run: |
          set -euo pipefail
          git fetch --no-tags origin production
          tip="$(git rev-parse origin/production)"
          echo "This run:          ${GITHUB_SHA}"
          echo "origin/production: ${tip}"
          if [ "${GITHUB_SHA}" != "${tip}" ]; then
            echo "::error title=Stale deploy blocked::This run is ${GITHUB_SHA}, but origin/production is ${tip}. A newer push landed while this deploy waited for review. Approve the newest green Deploy LLOVES LMS run instead."
            exit 1
          fi

      - name: Guard against dev login in production config
        run: |
          if grep -qE "^\s*LOCAL_DEV_LOGIN\s*=\s*['\"]?(1|true|yes)" fly.toml; then
            echo "LOCAL_DEV_LOGIN must never be enabled in fly.toml"
            exit 1
          fi

      # MCK-182: rebuild releases.json from the What's new lines of the PRs
      # in each deploy since the newest committed release. flyctl uploads
      # this working tree, so the generated file ships in this image and
      # nothing is committed. Any API problem keeps the committed file; the
      # step never blocks the deploy.
      - name: Write What's new for this deploy
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/whats_new.py build

      # MCK-231: a deploy replaces the only Fly machine. Refuse it while a
      # class is live; windows come from lms/seeds/live_class_windows.json
      # and frameworks/semester.json. Checked right before flyctl, since the
      # approval wait can be long. Override: Run workflow with
      # override_class_hours=true.
      - name: Refuse deploy during class hours
        env:
          OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.override_class_hours && '1' || '' }}
        run: python3 .github/scripts/class_hours_guard.py ${OVERRIDE:+--override}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --build-arg GH_SHA=${{ github.sha }}
