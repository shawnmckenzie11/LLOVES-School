      - paragraph [ref=f3e47]: Graph each parabola. Label the vertex and the axis of symmetry. a) y = x^2 − 6 b) y = (x − 2)^2 − 1 c) y = −3(x + 4)^2 + 2 d) y = 2x^2 + 6x
      - paragraph [ref=f3e48]: "Practice progression after the diagnostic: (b) is minus-inside, (c) is plus-inside plus a < 0 (axis-equation and max-min-from-a). Not a clone of Q7(d). · nelson_functions_11"
    - generic [ref=f3e49]:
