# LLOVES LMS — deploy from the repository root so Docker context
# includes frameworks/, lms/, tools/, and scripts/.
#
# Public URL: https://alc.mckenzian.com
# See lms/DEPLOY.md (Fly + Cloudflare CNAME, same pattern as hh / iaw).
#
#   fly volumes create lloves_data --region yyz --size 15
#   fly deploy
#
# Persistent volume holds sqlite + Admin-uploaded IMSCC libraries
# (extend with: fly volumes extend <vol_id> --size 15 -a lloves-lms).

app = 'lloves-lms'
primary_region = 'yyz'

# MCK-180: graceful shutdown on deploy, stop and machine swap. Fly's default
# is SIGINT with 5 s. gunicorn treats SIGINT as a quick shutdown (workers
# drop in-flight requests at once), and 5 s is shorter than the 30 s
# --graceful-timeout in [processes]. SIGTERM is gunicorn's graceful stop:
# stop accepting, finish in-flight requests for up to 30 s, then exit.
# 35 s gives that 30 s plus 5 s to exit before Fly forces the stop
# (Fly allows up to 300 s). These keys must stay at the top level, above
# the first [table]. Same numbers as serve_capacity.FLY_KILL_*.
kill_signal = 'SIGTERM'
kill_timeout = 35

[build]
  dockerfile = 'lms/Dockerfile'

# Same command as lms/Dockerfile CMD. Deploy must keep 4 × 8, timeout 120,
# and these socket bounds. One Fly app process on one shared-cpu-1x / 1 GB
# machine. The four workers are gunicorn processes inside that command, not
# a second machine.
# 2026-09-28: this capacity was already on the live machine CMD, and
# `fly machines restart` still wedged /health. `fly machines update`
# (fresh launch) restored it. Recovery under live polls is a fresh launch
# or an image deploy. Backlog 64 refuses the rest of that boot flood.
[processes]
  app = "gunicorn --worker-class gthread --workers 4 --threads 8 --worker-connections 32 --keep-alive 1 --timeout 120 --graceful-timeout 30 --backlog 64 --bind 0.0.0.0:8080 --chdir lms app:create_app()"

[env]
  FLASK_ENV = 'production'
  IT_EMAILS = 'solutions@mckenzian.com'
  # MCK-183: Sentry tags these teachers teacher_kind=owner; everyone else
  # is 'other'. Unset means everyone is 'other' (never hides an error).
  SENTRY_OWNER_EMAILS = 'shawnmckenzie11.sm@gmail.com,solutions@mckenzian.com'
  # Live heartbeat / Artifact polls use Postgres when LIVE_DATABASE_URL or a
  # postgres DATABASE_URL is set (fly mpg attach). Unset → sqlite. See
  # lms/LIVE_PRESENCE.md. This file does not set that secret.
  GOOGLE_REDIRECT_URI = 'https://alc.mckenzian.com/auth/google/callback'
  PUBLIC_APP_URL = 'https://alc.mckenzian.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.http_options]
    # Large IMSCC uploads (any size) + unpack can sit quiet after the body lands.
    # Free config — Fly Proxy has no hard body-size reject; disk on lloves_data is the cap.
    # Proxy idle for a quiet IMSCC body. gunicorn worker timeout is 120s
    # (see [processes]). Live /state sockets are closed by the app.
    # One shared-cpu-1x / 1 GB machine.
    idle_timeout = 600

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'lloves_data'
  destination = '/data'
