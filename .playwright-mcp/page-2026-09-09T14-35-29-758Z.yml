      - paragraph [ref=f4e212]: Look at the live equation labelled Vertex form and the dashed vertical line. What changed? What stayed the same? How do you read the new vertex from the equation?
      - heading "The same curve, two forms" [level=2] [ref=f4e213]
      - paragraph [ref=f4e214]: Vertex form makes the turning point easy to read. Expanding that form into ax² + bx + c should not move the curve.
      - generic [ref=f4e215]:
        - text: Worked example
        - paragraph [ref=f4e216]: Sketch a parabola that opens upward, turning left of the origin and below the x-axis. Mark the vertex. An equation that fits that sketch is
        - paragraph [ref=f4e217]: g(x) = (1)/(2)(x + 2)² - 3
        - paragraph [ref=f4e218]: The task is to write the same function as ax² + bx + c, then check that both forms give the same outputs.
        - paragraph [ref=f4e219]: "Square the binomial: (x + 2)² = x² + 4x + 4."
        - paragraph [ref=f4e220]: "Multiply by a = (1)/(2): (1)/(2)x² + 2x + 2."
        - paragraph [ref=f4e221]: "Add k = -3: (1)/(2)x² + 2x - 1."
        - paragraph [ref=f4e222]: g(x) = (1)/(2)x² + 2x - 1
        - paragraph [ref=f4e223]: "Check a few inputs. At x = -2, both forms give -3. At x = 0, both give -1. At x = -4, both give -1. The table points sit on the same graph: expanding did not make a new parabola."
