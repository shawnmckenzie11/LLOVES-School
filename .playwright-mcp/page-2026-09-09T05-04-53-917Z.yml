    - generic [ref=f5e204]:
      - paragraph [ref=f5e205]: A fresh case. Here is a new equation. Do not move the sliders yet.
      - paragraph [ref=f5e206]: f(x) = −0.5(x − 2)^2 + 4
      - paragraph [ref=f5e207]: Name the vertex, the axis of symmetry, and whether this is a maximum or a minimum. Then move one parameter to check.
      - paragraph [ref=f5e208]: "If you are on paper: sketch from the equation, then change one of a, h, or k and sketch again."
      - paragraph [ref=f5e209]: What to remember
      - paragraph [ref=f5e210]: "Vertex form is f(x) = a(x − h)^2 + k. You can read the vertex (h, k), the axis of symmetry x = h, and whether the graph has a maximum or a minimum from the sign of a: negative a means a maximum; positive a means a minimum."
      - paragraph [ref=f5e211]: Match the brackets to (x − h). A plus inside the brackets does not mean the vertex is on the positive side of the x-axis.
      - paragraph [ref=f5e212]: a stretches or flips the graph. k moves the vertex up or down. Those two jobs are not the same.
      - paragraph [ref=f5e213]: Expanding vertex form into f(x) = ax^2 + bx + c gives the same parabola, not a new one. The graphs should land on top of each other.
      - paragraph [ref=f5e214]: Vertex form does not make the x-intercepts as obvious as factored form. Do not treat the vertex as an intercept unless it actually sits on an axis.
      - paragraph [ref=f5e215]: You do not need to complete the square in this lesson.
