      - paragraph [ref=f13e285]: Do a few table points sit on both writings? If you plotted a second curve from your expanded coefficients, do the two graphs land on top of each other?
      - heading "What this writing is for" [level=2] [ref=f13e286]
      - paragraph [ref=f13e287]: You have been reading vertex form. Factored form f(x) = a(x - r)(x - s) makes the x-intercepts easy to see. Standard form f(x) = ax² + bx + c makes the y-intercept easy to see. Vertex form does not make those intercepts as obvious — and the vertex is not an intercept unless it actually sits on an axis.
      - paragraph [ref=f13e289]: What can you read from vertex form f(x) = a(x - h)² + k that is harder to see when the same function is written as f(x) = ax² + bx + c? Do not rewrite the function in another form.
      - heading "Expand a new writing yourself" [level=2] [ref=f13e290]
      - paragraph [ref=f13e292]: Given the vertex form f(x) = 3(x - 1)² + 4, express the equation in standard form. Use technology to compare the graphs of these two forms of the equation.
      - paragraph [ref=f13e293]: Here, standard form means f(x) = ax² + bx + c. Expand the vertex form yourself first, then compare the graphs. Do not skip the expansion by only reading a line off the graph.
      - heading "Another practice item" [level=2] [ref=f13e294]
      - generic [ref=f13e295]:
        - paragraph [ref=f13e297]: Determine the domain and range of f(x) = −2(x + 3)² − 6.
        - group [ref=f13e298]:
          - generic "Try another" [ref=f13e299]
      - paragraph [ref=f13e300]: "If the graph is not available, work on paper with f(x) = 2(x + 3)² + 1. First look at f(x) = (x + 3)² + 1: name that vertex, then sketch both writings (same turning point, different stretch). From the starting equation, predict what happens if you change only h to 2; rewrite the equation and sketch again. Expand the starting equation yourself and check that a few table points still sit on the same sketch."
