      - paragraph [ref=f3e51]: Determine the domain and range of f(x) = −2(x + 3)^2 − 6.
      - paragraph [ref=f3e52]: "Third practice step: same (x + 3) family as the diagnostic, now used to read range from k and the sign of a. Prerequisite A2.3 language; still serves vertex-form inspection. Not in the six-record catalogue as its own id — parent would need to add a record if this is chosen. · openstax"
    - generic [ref=f3e53]:
      - strong [ref=f3e54]: "transfer #1"
      - text: — Which form for which information (A2.10)
      - paragraph [ref=f3e55]: You can choose whether a quadratic is given in standard form, factored form, or vertex form. Which form would you pick if you needed the vertex? The y-intercept? The zeros? The axis of symmetry? The domain and range? Say why.
      - paragraph [ref=f3e56]: "Fresh case of the intended understanding: students choose vertex form when they need the vertex, axis, or max/min, and say what they cannot read (zeros). Matches A2.10’s three-form share without asking them to complete the square. · nelson_functions_11"
    - generic [ref=f3e57]:
      - strong [ref=f3e58]: "transfer #2"
      - text: "— OpenStax §5.1 ex. 53: family (x − 2)^2, (x − 3)^2, (x + 4)^2"
      - paragraph [ref=f3e59]: On the same axes, graph y = x^2, y = (x − 2)^2, y = (x − 3)^2, and y = (x + 4)^2. What stays the same? What moves, and in which direction?
      - paragraph [ref=f3e60]: "Parameter-change transfer after they can already name one vertex: (x + 4) versus (x − 2) forces the h-sign again on a family, then they explain the change. A2.5 is prerequisite; this reuses that language to inspect vertex form. Not a separate catalogue id yet. · openstax"
