<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if codename %}{{ codename }} · {% endif %}Class · {{ school_name }}</title>
  <link rel="stylesheet" href="/static/lloves.css">
  <link rel="stylesheet" href="/static/student-portal.css">
</head>
<body class="student-portal student-home{% if payload.scoring %} is-live{% elif payload.waiting_room != false %} is-waiting-room{% endif %}"
      data-scoring="{{ '1' if payload.scoring else '0' }}"
      data-visit-token="{{ visit_token or '' }}"
      data-codename="{{ codename or '' }}">
  <header class="student-chrome student-chrome-top" aria-label="Your stats">
    <p class="me-display-time" id="me-display-time" aria-live="polite" data-state="idle">—</p>
    <div id="me-board" class="student-me">
      <div class="me-name-row" id="me-name-row">
        <p class="me-name" id="me-name">Student</p>
        <p class="me-meet-chip" id="me-meet-chip" hidden></p>
      </div>
      <button type="button" class="save-work" id="save-work">Save Work</button>
      <p class="save-work-toast" id="save-work-toast" hidden role="status"></p>
      <div class="me-stats" id="me-stats">
        <p class="me-stat"><span class="me-stat-label">My points</span><strong id="me-points">0</strong></p>
        <p class="me-stat"><span class="me-stat-label" id="me-team-label">Team</span><strong id="me-team-points">0</strong></p>
        <p class="me-stat me-rank" id="me-rank" hidden><span class="me-stat-label">Rank</span><strong id="me-rank-value"></strong> <span class="me-stat-of" id="me-rank-of" hidden></span></p>
      </div>
    </div>
    <p class="student-round-banner" id="student-round-banner" hidden></p>
  </header>
  <main class="student-live-response" id="live-response" aria-live="polite">
    <p class="media-chip" id="media-chip" hidden></p>
    <p class="media-stem" id="media-stem" hidden></p>
    <p class="media-caption" id="media-caption" hidden></p>
    <p class="media-toast" id="media-toast" hidden role="status"></p>
    <ul class="media-answers" id="media-answers" hidden></ul>
    <div id="media-pane" class="media-pane" hidden>
      <div id="media-lock" class="student-frame-lock" hidden>Media locked</div>
      <iframe id="media-frame" title="Live class media" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <div id="canvas-pane" class="canvas-pane" hidden>
      <div id="canvas-lock" class="student-frame-lock">Canvas locked</div>
      <canvas id="student-canvas" class="student-canvas" width="720" height="360" aria-label="Live canvas"></canvas>
      <div id="canvas-cursors" class="canvas-cursors" aria-hidden="true"></div>
    </div>
    <p class="media-encore" id="media-encore" hidden>
      <a id="media-encore-link" href="#" target="_blank" rel="noopener noreferrer"></a>
    </p>
    <p class="student-wait" id="student-wait">{% if payload.scoring %}{% else %}Waiting room — class is about to begin.{% endif %}</p>
    <div id="question-frame" class="question-frame">
      <div id="prompt-shell" class="prompt-shell" hidden></div>
      <div id="prompt-feedback" class="prompt-feedback" hidden role="dialog" aria-modal="false" aria-labelledby="prompt-feedback-lead" tabindex="-1">
        <p id="prompt-feedback-lead" class="prompt-feedback-lead"></p>
        <p id="prompt-feedback-why" class="prompt-feedback-why"></p>
        <p id="prompt-feedback-helper" class="prompt-feedback-helper">You can Close whenever you’re ready.</p>
        <button type="button" class="prompt-feedback-close" id="prompt-feedback-close">Close</button>
      </div>
    </div>
    <p id="prompt-ack" class="prompt-ack" hidden>Response received.</p>
  </main>
  <footer class="student-chrome student-chrome-bottom" aria-label="Class scoreboard">
    <div id="class-board" class="student-scoreboard"></div>
  </footer>
  <script src="/static/student-visit-token.js"></script>
  <script src="/static/student-live-session.js"></script>
  <script type="module" src="/static/student-portal.js"></script>
</body>
</html>
