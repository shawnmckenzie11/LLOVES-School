name: CI

# Tests only. A pull request runs on pull_request (opened, synchronize,
# reopened). A push runs only for main. Title and body edits do not run
# this workflow. production is tested by deploy.yml.
# One run per ref: a newer push cancels the in-progress run for that ref.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.gate.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      # Copy-only pull requests set heavy=false. Push to main, a failed
      # diff, and any path outside the safe globs set heavy=true.
      # Globs: .github/scripts/ci_path_class.py
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ] || [ ! -f .github/scripts/ci_path_class.py ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/ci_path_class.py || echo "heavy=true" >> "$GITHUB_OUTPUT"

  test:
    name: LMS test suite
    runs-on: ubuntu-latest
    # Keep this Postgres block identical to the test job in deploy.yml.
    # N=28 dials LIVE_PRESENCE_TEST_URL (not LIVE_DATABASE_URL). Do not
    # export LIVE_DATABASE_URL or DATABASE_URL: those attach Postgres to
    # every create_app() and move the sqlite heartbeat bars off sqlite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lloves
          POSTGRES_PASSWORD: lloves
          POSTGRES_DB: lloves_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloves -d lloves_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea

      # Slide conversion uses unshare --map-root-user. Ubuntu 24.04 denies
      # that write to uid_map until this restriction is off.
      - name: Allow the slide sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Chrome for slide e2e
        run: |
          set -euo pipefail
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          npm install --prefix "${GITHUB_WORKSPACE}" playwright-core@1.49.1

      - name: Run tests
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
          LIVE_PRESENCE_TEST_URL: postgresql://lloves:lloves@127.0.0.1:5432/lloves_live
          LLOVES_E2E_CHROME: /usr/bin/google-chrome
        # MCK-52: a hang aborts with every thread's stack in the log instead of
        # sitting in_progress for hours.
        timeout-minutes: 30
        run: timeout -s ABRT 25m python -X faulthandler -m unittest discover -s lms -p 'test_*.py' -v

  fanout-guard:
    name: fan-out guard
    needs: classify
    # Copy-only pull requests skip this job. Push to main always runs it.
    # A missing classification runs it. Live-class state always matches a
    # heavy glob, so this job and the 30-seat load still run.
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify.outputs.heavy != 'false') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      - name: Fan-out guard
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
        timeout-minutes: 15
        run: python -m unittest discover -s lms -p 'test_fanout_guard.py' -v

  load-budget:
    name: 30-seat load budget
    needs: classify
    # Same gate as fan-out guard. Main and any non-copy diff run the budget.
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify.outputs.heavy != 'false') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      - name: 30-seat load budget
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
        timeout-minutes: 15
        run: python scripts/load_class.py --sqlite-budget --students 30 --out lc-qa/load-budget

  slide-load:
    name: slide forward load
    needs: classify
    # Same gate as fan-out guard. Main and any non-copy diff run this load.
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify.outputs.heavy != 'false') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lloves
          POSTGRES_PASSWORD: lloves
          POSTGRES_DB: lloves_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloves -d lloves_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt psutil

      - name: Slide forward load
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python3 scripts/load_class.py \
            --minutes 1 \
            --classes 2 \
            --students 15 \
            --items 2 \
            --round-minutes 0.25 \
            --slide-forward \
            --cpu-quota 100 \
            --gate \
            --min-classes 2 \
            --presence-url "postgresql://lloves:lloves@127.0.0.1:5432/lloves_live" \
            --out "${RUNNER_TEMP}/slide-forward"
