name: Deploy LLOVES LMS

# A push to main does not deploy. Merge to main, then fast-forward production to ship.
#
# Push to production runs the class-hours guard first. If a class is live,
# the run stops there. Otherwise four test shards and the 30-seat load
# smoke start together. Each shard has its own runner and Postgres. When
# this exact SHA already has a full green ci.yml run (all four shards, the
# LMS test suite aggregate, fan-out guard, 30-seat load budget, and slide
# forward load, none of them skipped), the shards are not run again.
# The smoke still runs. Deploy to Fly is the one production-environment
# approval: Shawn clicks once, and that same job runs the SHA guard, the
# class-hours guard again, and flyctl deploy.
#
# workflow_dispatch runs the same jobs. Only refs/heads/production gets
# past the smoke to Deploy to Fly. A red suite or a red smoke skips
# deploy, so flyctl does not run. The smoke runs on the CI runner against
# 127.0.0.1. It never calls flyctl and never receives FLY_API_TOKEN.
# Feature branches never run this workflow; they test via ci.yml.
#
# Concurrency (MCK-126):
#   test   group deploy-lloves-lms-test-<ref>-<shard>, cancel-in-progress true.
#          A newer run on the same ref cancels the older shard still testing.
#          Shards do not share a group, so they do not cancel each other.
#   smoke  group deploy-lloves-lms-smoke-<ref>, cancel-in-progress true.
#          MCK-44. Local 30-seat gunicorn (two classes). A newer run
#          cancels an older smoke. Nothing here touches Fly.
#   deploy group deploy-lloves-lms-fly, cancel-in-progress false.
#          The only production-environment approval, so FLY_API_TOKEN is
#          read here. One click, then flyctl. Never cancelled by a newer
#          run; a newer deploy waits as pending (one pending slot).
# The SHA guard refuses flyctl unless GITHUB_SHA is still origin/production.
# Re-running Deploy to Fly asks for the production review again.
#
# Not a code deploy: attach-live-postgres.yml is workflow_dispatch only.
# It does not flyctl deploy. It can restart lloves-lms and waits on the
# same production environment.
#
# FLY_API_TOKEN is the Fly deploy token for app lloves-lms. The deploy job
# names the production environment, so it reads the token from that
# environment when the secret is set there, and from the repository secret
# until then.
on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      override_class_hours:
        description: "Deploy even during a live class window (MCK-231). The one Fly machine is replaced; students drop for ~30 s."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  class-hours:
    name: Class hours
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Fail before any shard or smoke when a class is live. One plain line.
      # The Deploy to Fly job checks again after the approval wait.
      - name: Refuse deploy during class hours
        env:
          OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.override_class_hours && '1' || '' }}
        run: python3 .github/scripts/class_hours_guard.py --plain ${OVERRIDE:+--override}

  reuse:
    name: Reuse green main CI
    needs: class-hours
    if: always() && !cancelled() && needs.class-hours.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/reuse_green_ci.py

  test-shard:
    name: LMS tests shard ${{ matrix.shard }} of 4
    needs: [class-hours, reuse]
    if: always() && !cancelled() && needs.class-hours.result != 'failure' && needs.reuse.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: deploy-lloves-lms-test-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    # Same Postgres the feature-branch shards use (ci.yml). The N=28
    # Artifact load test dials LIVE_PRESENCE_TEST_URL and fails the job
    # when CI is set and that server is down.
    # Do not export LIVE_DATABASE_URL or DATABASE_URL on this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lloves
          POSTGRES_PASSWORD: lloves
          POSTGRES_DB: lloves_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloves -d lloves_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Plan shard
        id: plan
        run: python3 .github/scripts/lms_test_shards.py plan --shard ${{ matrix.shard }} --shards 4

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      - name: Install LibreOffice
        if: steps.plan.outputs.soffice == 'true'
        timeout-minutes: 12
        continue-on-error: true
        run: bash .github/scripts/install_libreoffice.sh

      - name: Allow the slide sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
          LIVE_PRESENCE_TEST_URL: postgresql://lloves:lloves@127.0.0.1:5432/lloves_live
        timeout-minutes: 20
        run: timeout -s ABRT 18m python -X faulthandler .github/scripts/lms_test_shards.py run --shard ${{ matrix.shard }} --shards 4 --timings shard-timings.json

      - name: Upload shard timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lms-shard-timings-${{ matrix.shard }}
          path: shard-timings.json
          if-no-files-found: warn
          retention-days: 14

  test:
    name: LMS test suite
    needs: [class-hours, reuse, test-shard]
    if: always() && !cancelled() && needs.class-hours.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # MCK-182: show this deploy's What's new lines on the run summary, so
      # they can be read before the production approval. Never fails the job.
      - name: Preview What's new
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/whats_new.py build --out "${RUNNER_TEMP}/releases.preview.json"

      - name: Download shard timings
        if: needs.test-shard.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: lms-shard-timings-*
          path: timings

      - name: Aggregate shards
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
          REUSE_SKIP: ${{ needs.reuse.outputs.skip }}
          LMS_TOUCHED: "true"
          TIMINGS_DIR: timings
        run: python3 .github/scripts/lms_test_shards.py aggregate

  load-smoke:
    name: 30-seat load smoke
    needs: class-hours
    # Parallel with the shards. production only. The gunicorn process is
    # on this runner. It does not deploy. A red class-hours check skips it.
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: deploy-lloves-lms-smoke-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lloves
          POSTGRES_PASSWORD: lloves
          POSTGRES_DB: lloves_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloves -d lloves_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # psutil is the sampler only. It is not an LMS runtime dependency.
        run: python -m pip install -r lms/requirements.txt psutil

      - name: 30-seat two-class smoke
        timeout-minutes: 12
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
          PGPASSWORD: lloves
        # 15 students × 2 classes = 30 seats on one local gunicorn.
        # --gate requires 0 errors, HTTP p95 < 400 ms, 0 worker restarts.
        # 400 ms (not 250) leaves margin for shared runners.
        # One retry, and only when every 5xx is a client-timeout 599.
        # A 500-504, a latency miss, or a database error fails immediately.
        run: |
          set -euo pipefail
          drop_load_dbs() {
            local db
            for db in $(psql -h 127.0.0.1 -U lloves -d lloves_live -Atc "SELECT datname FROM pg_database WHERE datname LIKE 'load\_%'"); do
              psql -h 127.0.0.1 -U lloves -d lloves_live -c "DROP DATABASE IF EXISTS \"${db}\" WITH (FORCE)"
            done
          }
          smoke() {
            python3 scripts/load_class.py \
              --minutes 1 \
              --classes 2 \
              --students 15 \
              --items 2 \
              --round-minutes 10 \
              --gate \
              --max-p95-ms 400 \
              --min-classes 2 \
              --presence-url "postgresql://lloves:lloves@127.0.0.1:5432/lloves_live" \
              --out "$1"
          }
          out="${RUNNER_TEMP}/load-smoke"
          set +e
          smoke "$out"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$code" -ne 1 ]; then
            echo "load-smoke: exit ${code}; database or setup errors are not retried"
            exit "$code"
          fi
          retry=false
          if [ -f "$out/retry.json" ]; then
            retry=$(python3 -c 'import json,sys; print("true" if json.load(open(sys.argv[1])).get("retry") is True else "false")' "$out/retry.json")
          fi
          if [ "$retry" != "true" ]; then
            echo "load-smoke: not retrying"
            exit "$code"
          fi
          echo "load-smoke: all failures were client-timeout 599s; dropping load_% databases and retrying once"
          drop_load_dbs
          set +e
          smoke "${RUNNER_TEMP}/load-smoke-retry"
          code=$?
          set -e
          rm -rf "$out"
          mv "${RUNNER_TEMP}/load-smoke-retry" "$out"
          exit "$code"

      - name: Drop load smoke databases
        # load_class.py drops its db on exit; this catches a killed run.
        if: always()
        env:
          PGPASSWORD: lloves
        run: |
          for db in $(psql -h 127.0.0.1 -U lloves -d lloves_live -Atc "SELECT datname FROM pg_database WHERE datname LIKE 'load\_%'"); do
            psql -h 127.0.0.1 -U lloves -d lloves_live -c "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE)"
          done

      - name: Upload load smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/load-smoke
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy to Fly
    needs: [test, load-smoke]
    # workflow_dispatch can target any ref. Only production may request a
    # production review. A red suite or a red load smoke skips this job, so
    # approval cannot ship a failed build.
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    # pull-requests/actions: read so What's new can read merged PRs and
    # past Deploy runs (MCK-182). Nothing here writes to the repo.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    # One flyctl deploy at a time, and never cancelled by a newer run:
    # mid-deploy cancellation is unsafe. A newer run waits here as pending;
    # a still-newer one replaces it (queue single).
    # This is the only production-environment approval. GitHub waits for
    # the required reviewer before any step, then this job deploys.
    # FLY_API_TOKEN is the environment secret once it is added there.
    # A re-run asks for that review again.
    environment:
      name: production
      url: https://alc.mckenzian.com
    concurrency:
      group: deploy-lloves-lms-fly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a stale production SHA
        run: |
          set -euo pipefail
          git fetch --no-tags origin production
          tip="$(git rev-parse origin/production)"
          echo "This run:          ${GITHUB_SHA}"
          echo "origin/production: ${tip}"
          if [ "${GITHUB_SHA}" != "${tip}" ]; then
            echo "::error title=Stale deploy blocked::This run is ${GITHUB_SHA}, but origin/production is ${tip}. A newer push landed while this deploy waited for review. Approve the newest green Deploy LLOVES LMS run instead."
            exit 1
          fi

      - name: Guard against dev login in production config
        run: |
          if grep -qE "^\s*LOCAL_DEV_LOGIN\s*=\s*['\"]?(1|true|yes)" fly.toml; then
            echo "LOCAL_DEV_LOGIN must never be enabled in fly.toml"
            exit 1
          fi

      # MCK-182: rebuild releases.json from the What's new lines of the PRs
      # in each deploy since the newest committed release. flyctl uploads
      # this working tree, so the generated file ships in this image and
      # nothing is committed. Any API problem keeps the committed file; the
      # step never blocks the deploy.
      - name: Write What's new for this deploy
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/whats_new.py build

      # MCK-231: a deploy replaces the only Fly machine. Refuse it while a
      # class is live; windows come from lms/seeds/live_class_windows.json
      # and frameworks/semester.json. Checked right before flyctl, since the
      # approval wait can be long. Override: Run workflow with
      # override_class_hours=true.
      - name: Refuse deploy during class hours
        env:
          OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.override_class_hours && '1' || '' }}
        run: python3 .github/scripts/class_hours_guard.py ${OVERRIDE:+--override}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # Stage the key for the deploy below. An empty secret leaves Fly
      # unchanged. The value stays in the env and goes to flyctl on stdin.
      - name: Stage Anthropic key
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "ANTHROPIC_API_KEY is empty; Fly secret left unchanged."
            exit 0
          fi
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" | flyctl secrets import --stage -a lloves-lms

      # Same pattern as the Anthropic key. An empty secret is skipped.
      - name: Stage live-fix pepper
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LIVE_FIX_ANON_PEPPER: ${{ secrets.LIVE_FIX_ANON_PEPPER }}
        run: |
          set -euo pipefail
          if [ -z "${LIVE_FIX_ANON_PEPPER}" ]; then
            echo "LIVE_FIX_ANON_PEPPER is empty; Fly secret left unchanged."
            exit 0
          fi
          printf 'LIVE_FIX_ANON_PEPPER=%s\n' "$LIVE_FIX_ANON_PEPPER" | flyctl secrets import --stage -a lloves-lms

      # Sentry read access for the End Live Class report (MCK-480).
      # Same pattern: empty secrets are skipped, values go on stdin.
      - name: Stage Sentry report secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN}" ] || [ -z "${SENTRY_ORG}" ]; then
            echo "SENTRY_AUTH_TOKEN or SENTRY_ORG is empty; Fly secrets left unchanged."
            exit 0
          fi
          printf 'SENTRY_AUTH_TOKEN=%s\nSENTRY_ORG=%s\n' "$SENTRY_AUTH_TOKEN" "$SENTRY_ORG" | flyctl secrets import --stage -a lloves-lms

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --build-arg GH_SHA=${{ github.sha }}
