name: Copy-only fast lane

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  copy-only:
    if: contains(format(',{0},', join(github.event.pull_request.labels.*.name, ',')), ',copy-only,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r lms/requirements.txt

      - name: Copy-only diff guard
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/copy_only_check.py "$BASE" "$HEAD"

      - name: Template render smoke (Flask test client)
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/copy_only_template_smoke.py "$BASE" "$HEAD"
