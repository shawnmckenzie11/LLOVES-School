      - paragraph [ref=e306]: Do a few table points sit on both forms? If you plotted a second curve from your expanded coefficients, do the two graphs land on top of each other?
      - heading "Expand a new equation yourself" [level=2] [ref=e307]
      - paragraph [ref=e308]: Here, standard form means f(x) = ax² + bx + c. Expand the vertex form yourself first, then compare the graphs. Do not skip the expansion by only reading a line off the graph.
      - paragraph [ref=e311]: Given the vertex form f(x) = 3(x - 1)² + 4, express the equation in standard form. Use technology to compare the graphs of these two forms of the equation.
      - heading "How you know two forms are the same" [level=2] [ref=e312]
      - paragraph [ref=e313]: You expanded and checked a few table points. These next items ask which method proves the forms match for every x, and they ask you to repair a first invalid expansion step.
      - generic [ref=e314]:
        - paragraph [ref=e316]: You have f(x) = 2(x + 3)² + 1 and a candidate standard form. You may expand algebraically or compare graphs. Using the criterion “prove they are the same function for every x,” which method would you choose, and why?
        - paragraph [ref=e318]: A student expands 2(x + 3)² + 1 as 2x² + 3² + 1 = 2x² + 10. Locate the first invalid step, explain it, and repair the expansion.
      - paragraph [ref=e321]: Two forms give the same three table values. A student says that proves the forms are the same function for every x. Prove, qualify, or refute that claim.
      - heading "What vertex form is for" [level=2] [ref=e322]
      - generic [ref=e323]:
        - text: Worked example
        - paragraph [ref=e324]: Consider f(x) = a(x - h)² + k. What can you read from vertex form that is harder to see when the same function is written in standard form f(x) = ax² + bx + c? Do not rewrite the function.
        - paragraph [ref=e325]: From vertex form you can read the vertex (h, k), the axis x = h, and whether the vertex is a maximum or a minimum from the sign of a. Standard form makes the y-intercept c easy to see. Zeros are not obvious in either of those two forms unless they happen to sit on an axis.
        - paragraph [ref=e326]: Factored form f(x) = a(x - r)(x - s) makes the x-intercepts easy to see. Vertex form does not make those intercepts as obvious, and the vertex is not an intercept unless it actually sits on an axis.
      - paragraph [ref=e329]: You need the highest point of a quadratic path, not the x-intercepts. Which of standard form, vertex form, or factored form would you choose, and why? Mention what that form does not make obvious.
      - heading "Zeros from vertex form" [level=2] [ref=e330]
      - paragraph [ref=e331]: Intercepts are not readable from vertex form the way they are from factored form. You can still find zeros by undoing the operations in the equation.
      - paragraph [ref=e334]: The graph of f(x) = (x - 1)² - 9 meets the x-axis where f(x) = 0. Determine those zeros by inverse operations. You may check on a graph afterward.
      - heading "Write an equation from stated facts" [level=2] [ref=e335]
      - paragraph [ref=e336]: You have been reading a, h, and k from a given equation. These next items ask you to write a vertex-form equation from a vertex and another point, from a labelled graph, or from a turning point that does not fix a.
      - generic [ref=e337]:
        - paragraph [ref=e339]: A parabola has vertex (1, -2) and passes through (3, 2). Determine the vertex-form equation. Is this equation unique given those two conditions?
        - paragraph [ref=e341]: A graph of a parabola is labelled with vertex (-4, 1) and one other point (0, -3), and it opens downward. Write a vertex-form equation that fits those features. Name which graph facts became a, h, and k.
        - paragraph [ref=e343]: Construct two different vertex-form equations that both have vertex (0, 3). What is the same on both graphs, and what changes?
      - paragraph [ref=e344]: "If the graph is not available, work on paper with f(x) = 2(x + 3)² + 1. First look at f(x) = (x + 3)² + 1: name that vertex, then sketch both equations (same turning point, different stretch). From the starting equation, predict what happens if you change only h to 2; rewrite the equation and sketch again. Expand the starting equation yourself and check that a few table points still sit on the same sketch."
