    - heading "Practice" [level=2] [ref=f6e107]
    - generic [ref=f6e108]:
      - paragraph [ref=f6e109]: Practice 1. In this course, f(x) = a(x − h)^2 + k is called vertex form. What can you read from it that is harder to see when the same function is written as f(x) = ax^2 + bx + c?
      - paragraph [ref=f6e110]: "(Adapted from OpenStax College Algebra 2e §5.1, CC BY-NC-SA 4.0. Source: https://openstax.org/books/college-algebra-2e/pages/5-1-quadratic-functions. Their wording asks about writing a quadratic in “standard form”; they mean a(x − h)^2 + k. That is not what this course means by standard form.)"
      - paragraph [ref=f6e111]: "Practice 2. Ontario sample:"
      - paragraph [ref=f6e112]: Given the vertex form f(x) = 3(x − 1)^2 + 4, express the equation in standard form. Use technology to compare the graphs of these two forms of the equation.
      - paragraph [ref=f6e113]: In this course, standard form means f(x) = ax^2 + bx + c. Expand the vertex form yourself first. Then compare the graphs — you may use the graph tool. Do not skip the expansion by only reading a line off the board.
