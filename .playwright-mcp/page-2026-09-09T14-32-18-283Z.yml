            - heading "Look at the streams" [level=3] [ref=f15e11]
            - figure [ref=f15e16]:
              - img "Two streams of water shoot from nozzles on a stone fountain rim and fall back into the basin. Each stream makes a smooth downward-opening arc; the highest point of each arc is visible against a park fence and trees." [ref=f15e17]
            - paragraph [ref=f15e18]: Look at the water leaving the fountain. Each stream goes up and comes down.
            - paragraph [ref=f15e20]: Choose one stream. Name the highest point of that stream — the place the water does not go above. Say where it is on the photograph. The photograph cannot be marked. Do not measure, and do not write an equation yet.
          - paragraph [ref=f15e21]: That turning point is the fact we will want from an equation of the curve. Vertex form makes the high or low point readable.
          - paragraph [ref=f15e22]: A quadratic written as
          - paragraph [ref=f15e23]: f(x) = a(x - h)² + k
          - paragraph [ref=f15e24]: "is in vertex form. The vertex is the point (h, k). The axis of symmetry is the vertical line x = h. The sign of a tells you whether that vertex is a maximum or a minimum: negative a opens downward, so the vertex is a highest point; positive a opens upward, so the vertex is a lowest point."
          - paragraph [ref=f15e25]: Look at f(x) = (x + 3)² + 1. The equation is already in vertex form, but notice the sign inside the brackets.
          - paragraph [ref=f15e26]: f(x) = (x + 3)² + 1
          - paragraph [ref=f15e28]: Where is the vertex? Write its coordinates before you check on the graph.
