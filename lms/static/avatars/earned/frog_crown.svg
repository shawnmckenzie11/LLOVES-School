  <path d="M13.6 11.4 L13.6 5.2 L16 7.8 L18 4 L20 7.8 L22.4 5.2 L22.4 11.4 Z" fill="#f5c518"/>
  <rect x="13.2" y="10" width="9.6" height="2" rx="0.8" fill="#c99a06"/>
</svg>
