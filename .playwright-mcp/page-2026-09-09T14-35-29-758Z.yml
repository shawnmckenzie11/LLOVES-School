      - paragraph [ref=f4e304]: Do a few table points sit on both forms? If you plotted a second curve from your expanded coefficients, do the two graphs land on top of each other?
      - heading "What vertex form is for" [level=2] [ref=f4e305]
      - paragraph [ref=f4e306]: You have been reading vertex form. Factored form f(x) = a(x - r)(x - s) makes the x-intercepts easy to see. Standard form f(x) = ax² + bx + c makes the y-intercept easy to see. Vertex form does not make those intercepts as obvious — and the vertex is not an intercept unless it actually sits on an axis.
      - paragraph [ref=f4e308]: What can you read from vertex form f(x) = a(x - h)² + k that is harder to see when the same function is written as f(x) = ax² + bx + c? Do not rewrite the function in another form.
      - heading "Expand a new equation yourself" [level=2] [ref=f4e309]
      - paragraph [ref=f4e311]: Given the vertex form f(x) = 3(x - 1)² + 4, express the equation in standard form. Use technology to compare the graphs of these two forms of the equation.
      - paragraph [ref=f4e312]: Here, standard form means f(x) = ax² + bx + c. Expand the vertex form yourself first, then compare the graphs. Do not skip the expansion by only reading a line off the graph.
      - heading "One more to try" [level=2] [ref=f4e313]
