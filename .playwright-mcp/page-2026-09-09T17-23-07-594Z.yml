    - generic [ref=e34]:
      - paragraph [ref=e35]: In this course, f(x) = a(x - h)² + k is vertex form. The expanded equation f(x) = ax² + bx + c is standard form.
      - heading "Read the turning point from the equation" [level=2] [ref=e36]
      - paragraph [ref=e37]: "You named a vertex from a plus inside the brackets. Read this next equation the same way: vertex, axis, and whether the turning point is a maximum or a minimum."
      - generic [ref=e38]:
        - text: Worked example
        - paragraph [ref=e39]: Consider
        - paragraph [ref=e40]: y = -3(x + 2)² + 4
        - paragraph [ref=e41]: Name the vertex. Is the vertex a maximum or a minimum? How did you know?
        - paragraph [ref=e42]: Compare the equation with y = a(x - h)² + k.
        - paragraph [ref=e43]: The brackets contain (x + 2). Vertex form uses (x - h), so rewrite x + 2 as x - (-2). That makes h = -2. The constant outside the brackets is +4, so k = 4.
        - paragraph [ref=e44]: The vertex is (-2, 4). The axis of symmetry is the vertical line through the vertex, x = -2.
        - paragraph [ref=e45]: The coefficient in front of the brackets is -3. Because a is negative, the parabola opens downward, so the vertex is a maximum. The maximum value of the function is 4, and it occurs when x = -2.
        - paragraph [ref=e46]: That highest point is the same kind of fact you named on the water stream, now read from the equation.
      - heading "A second equation, with nothing added outside" [level=2] [ref=e47]
      - generic [ref=e48]:
        - text: Another example
        - paragraph [ref=e49]: The last equation had a constant outside the brackets, so k was easy to see as a height. Consider
        - paragraph [ref=e50]: h(x) = -2(x + 1)²
        - paragraph [ref=e51]: The brackets contain (x + 1). Rewrite x + 1 as x - (-1), so h = -1. There is no constant added outside, so k = 0. The vertex is (-1, 0), and the axis is x = -1.
        - paragraph [ref=e52]: The coefficient is -2, so a is negative and the parabola opens downward. The vertex is a maximum even though k = 0. Maximum versus minimum comes from the sign of a, not from whether k looks positive.
        - paragraph [ref=e54]: Where is the vertex? Does this graph have a maximum or a minimum? Could you decide that from k alone?
