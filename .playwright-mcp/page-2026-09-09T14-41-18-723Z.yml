  - generic [ref=f5e504]: "[ { \"block_id\": \"minds-on--card--1\", \"field\": \"label\", \"before\": \"\", \"after\": \"Look at the streams\" }, { \"block_id\": \"minds-on--figure--1\", \"field\": \"alt\", \"before\": \"\", \"after\": \"Two streams of water shoot from nozzles on a stone fountain rim and fall back into the basin. Each stream makes a smooth downward-opening arc; the highest point of each arc is visible against a park fence and trees.\" }, { \"block_id\": \"minds-on--p--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"Look at the water leaving the fountain. Each stream goes up and comes down.\" }, { \"block_id\": \"minds-on--task--1\", \"field\": \"prompt\", \"before\": \"\", \"after\": \"Choose one stream. Name the highest point of that stream — the place the water does not go above. Say where it is on the photograph. The photograph cannot be marked. Do not measure, and do not write an equation yet.\" }, { \"block_id\": \"minds-on--p--2\", \"field\": \"text\", \"before\": \"\", \"after\": \"That turning point is the fact we will want from an equation of the curve. Vertex form makes the high or low point readable.\" }, { \"block_id\": \"minds-on--p--3\", \"field\": \"text\", \"before\": \"\", \"after\": \"A quadratic written as\" }, { \"block_id\": \"minds-on--equation--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"\\\\(f(x) = a(x - h)^2 + k\\\\)\" }, { \"block_id\": \"minds-on--p--4\", \"field\": \"text\", \"before\": \"\", \"after\": \"is in vertex form. The vertex is the point \\\\((h, k)\\\\). The axis of symmetry is the vertical line \\\\(x = h\\\\). The sign of \\\\(a\\\\) tells you whether that vertex is a maximum or a minimum: negative \\\\(a\\\\) opens downward, so the vertex is a highest point; positive \\\\(a\\\\) opens upward, so the vertex is a lowest point.\" }, { \"block_id\": \"minds-on--p--5\", \"field\": \"text\", \"before\": \"\", \"after\": \"Look at \\\\(f(x) = (x + 3)^2 + 1\\\\). The equation is already in vertex form, but notice the sign inside the brackets.\" }, { \"block_id\": \"minds-on--equation--2\", \"field\": \"text\", \"before\": \"\", \"after\": \"\\\\(f(x) = (x + 3)^2 + 1\\\\)\" }, { \"block_id\": \"minds-on--task--2\", \"field\": \"prompt\", \"before\": \"\", \"after\": \"Where is the vertex? Write its coordinates before you check on the graph.\" }, { \"block_id\": \"action--p--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"In this course, \\\\(f(x) = a(x - h)^2 + k\\\\) is vertex form. The expanded equation \\\\(f(x) = ax^2 + bx + c\\\\) is standard form.\" }, { \"block_id\": \"action--h2--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"Read the turning point from the equation\" }, { \"block_id\": \"action--p--2\", \"field\": \"text\", \"before\": \"\", \"after\": \"You named a vertex from a plus inside the brackets. Read this next equation the same way — vertex, axis, and whether the turning point is a maximum or a minimum.\" }, { \"block_id\": \"action--example--1--p--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"Sketch a parabola that opens downward and turns at a point left of the origin and above the \\\\(x\\\\)-axis. Label that turning point. Draw a dashed vertical line through it.\" }, { \"block_id\": \"action--example--1--p--2\", \"field\": \"text\", \"before\": \"\", \"after\": \"The equation of that graph is\" }, { \"block_id\": \"action--example--1--equation--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"\\\\(y = -3(x + 2)^2 + 4\\\\)\" }, { \"block_id\": \"action--example--1--p--3\", \"field\": \"text\", \"before\": \"\", \"after\": \"We need the vertex, the axis of symmetry, and whether the vertex is a maximum or a minimum.\" }, { \"block_id\": \"action--example--1--p--4\", \"field\": \"text\", \"before\": \"\", \"after\": \"Compare the equation with \\\\(y = a(x - h)^2 + k\\\\).\" }, { \"block_id\": \"action--example--1--p--5\", \"field\": \"text\", \"before\": \"\", \"after\": \"The brackets contain \\\\((x + 2)\\\\). Vertex form uses \\\\((x - h)\\\\), so rewrite \\\\(x + 2\\\\) as \\\\(x - (-2)\\\\). That makes \\\\(h = -2\\\\). The constant outside the brackets is \\\\(+4\\\\), so \\\\(k = 4\\\\).\" }, { \"block_id\": \"action--example--1--p--6\", \"field\": \"text\", \"before\": \"\", \"after\": \"The vertex is \\\\((-2, 4)\\\\). The axis of symmetry is the vertical line through the vertex, \\\\(x = -2\\\\).\" }, { \"block_id\": \"action--example--1--p--7\", \"field\": \"text\", \"before\": \"\", \"after\": \"The coefficient in front of the brackets is \\\\(-3\\\\). Because \\\\(a\\\\) is negative, the parabola opens downward, so the vertex is a maximum. The maximum value of the function is \\\\(4\\\\), and it occurs when \\\\(x = -2\\\\).\" }, { \"block_id\": \"action--example--1--p--8\", \"field\": \"text\", \"before\": \"\", \"after\": \"That highest point is the same kind of fact you named on the water stream, now read from the equation.\" }, { \"block_id\": \"action--h2--2\", \"field\": \"text\", \"before\": \"\", \"after\": \"A second equation, with nothing added outside\" }, { \"block_id\": \"action--example--2--p--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"The last equation had a constant outside the brackets, so \\\\(k\\\\) was easy to see as a height. This Ontario sample includes\" }, { \"block_id\": \"action--example--2--equation--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"\\\\(h(x) = -2(x + 1)^2\\\\)\" }, { \"block_id\": \"action--example--2--p--2\", \"field\": \"text\", \"before\": \"\", \"after\": \"as one of the graphs to read from \\\\(f(x) = x^2\\\\). Use it here to inspect vertex form. (The sample also names \\\\(g(x) = x^2 - 4\\\\); stay with \\\\(h(x)\\\\).)\" }, { \"block_id\": \"action--example--2--p--3\", \"field\": \"text\", \"before\": \"\", \"after\": \"The brackets contain \\\\((x + 1)\\\\). Rewrite \\\\(x + 1\\\\) as \\\\(x - (-1)\\\\), so \\\\(h = -1\\\\). There is no constant added outside, so \\\\(k = 0\\\\). The vertex is \\\\((-1, 0)\\\\), and the axis is \\\\(x = -1\\\\).\" }, { \"block_id\": \"action--example--2--p--4\", \"field\": \"text\", \"before\": \"\", \"after\": \"The coefficient is \\\\(-2\\\\), so \\\\(a\\\\) is negative and the parabola opens downward. The vertex is a maximum even though \\\\(k = 0\\\\). Maximum versus minimum comes from the sign of \\\\(a\\\\), not from whether \\\\(k\\\\) looks positive.\" }, { \"block_id\": \"action--example--2--task--1\", \"field\": \"prompt\", \"before\": \"\", \"after\": \"Could you have decided maximum versus minimum from \\\\(k\\\\) on this equation? Say why or why not.\" }, { \"block_id\": \"action--h2--3\", \"field\": \"text\", \"before\": \"\", \"after\": \"Match the equation you already read\" }, { \"block_id\": \"action--p--3\", \"field\": \"text\", \"before\": \"\", \"after\": \"You named a vertex for \\\\(f(x) = (x + 3)^2 + 1\\\\). The graph starts at a different equation with the same brackets:\" }, { \"block_id\": \"action--equation--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"\\\\(f(x) = 2(x + 3)^2 + 1\\\\)\" }, { \"block_id\": \"action--card--1\", \"field\": \"label\", \"before\": \"\", \"after\": \"Match the equation you already read\" }, { \"block_id\": \"action--p--4\", \"field\": \"text\", \"before\": \"\", \"after\": \"Do not move the graph yet. Keep the point you wrote. Then move the graph until it matches \\\\(f(x) = (x + 3)^2 + 1\\\\). Submit when the live equation labelled Vertex form matches that equation.\" }, { \"block_id\": \"action--self-check--1\", \"field\": \"prompt\", \"before\": \"\", \"after\": \"Compare the vertex marker with the point you named. What in the equation told you the vertex? What did you have to change to match this equation?\" }, { \"block_id\": \"action--h2--4\", \"field\": \"text\", \"before\": \"\", \"after\": \"Change only the horizontal position\" }, { \"block_id\": \"action--p--5\", \"field\": \"text\", \"before\": \"\", \"after\": \"The graph is back at \\\\(f(x) = 2(x + 3)^2 + 1\\\\). Do not move the graph yet.\" }, { \"block_id\": \"action--task--1\", \"field\": \"prompt\", \"before\": \"\", \"after\": \"If you change only \\\\(h\\\\) so the vertex sits at \\\\(x = 2\\\\), what will happen to the graph, and what will the new equation look like? Write that first.\" }, { \"block_id\": \"action--card--2\", \"field\": \"label\", \"before\": \"\", \"after\": \"Change only h\" }, { \"block_id\": \"action--p--6\", \"field\": \"text\", \"before\": \"\", \"after\": \"Then move the graph so the vertex is at \\\\(x = 2\\\\), changing only \\\\(h\\\\) if you can. Submit. Say which quantity you meant to change: \\\\(a\\\\), \\\\(h\\\\), or \\\\(k\\\\).\" }, { \"block_id\": \"action--self-check--2\", \"field\": \"prompt\", \"before\": \"\", \"after\": \"Look at the live equation labelled Vertex form and the dashed vertical line. What changed? What stayed the same? How do you read the new vertex from the equation?\" }, { \"block_id\": \"action--h2--5\", \"field\": \"text\", \"before\": \"\", \"after\": \"The same curve, two forms\" }, { \"block_id\": \"action--p--7\", \"field\": \"text\", \"before\": \"\", \"after\": \"Vertex form makes the turning point easy to read. Expanding that form into \\\\(ax^2 + bx + c\\\\) should not move the curve.\" }, { \"block_id\": \"action--example--3--p--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"Sketch a parabola that opens upward, turning left of the origin and below the \\\\(x\\\\)-axis. Mark the vertex. An equation that fits that sketch is\" }, { \"block_id\": \"action--example--3--equation--1\", \"field\": \"text\", \"before\": \"\", \"after\": \"\\\\(g(x) = \\\\frac{1}{2}(x + 2)^2 - 3\\\\)\" }, { \"block_id\": \"action--example--3--p--2\", \"field\": \"text\", \"before\": \"\", \"after\": \"The task is to write the same function as \\\\(ax^2 + bx + c\\\\), then check that both forms give the same outputs.\" }, { \"block_id\": \"action--example--3--p--3\", \"field\"