      - paragraph [ref=f13e196]: Look at the equation under the graph and the dashed vertical line. What changed? What stayed the same? How do you read the new vertex from the equation?
      - heading "The same curve, two writings" [level=2] [ref=f13e197]
      - paragraph [ref=f13e198]: Vertex form makes the turning point easy to read. Expanding that writing into ax² + bx + c should not move the curve.
      - generic [ref=f13e199]:
        - text: Worked example
        - paragraph [ref=f13e200]: Sketch a parabola that opens upward, turning left of the origin and below the x-axis. Mark the vertex. A writing that fits that sketch is
        - paragraph [ref=f13e201]: g(x) = ½(x + 2)² - 3
        - paragraph [ref=f13e202]: The task is to write the same function as ax² + bx + c, then check that both writings give the same outputs.
        - paragraph [ref=f13e203]: "Square the binomial: (x + 2)² = x² + 4x + 4."
        - paragraph [ref=f13e204]: "Multiply by a = ½: ½x² + 2x + 2."
        - paragraph [ref=f13e205]: "Add k = -3: ½x² + 2x - 1."
        - paragraph [ref=f13e206]: g(x) = ½x² + 2x - 1
        - paragraph [ref=f13e207]: "Check a few inputs. At x = -2, both writings give -3. At x = 0, both give -1. At x = -4, both give -1. The table points sit on the same graph: expanding did not make a new parabola."
      - paragraph [ref=f13e208]: Now expand the starting equation from the graph, f(x) = 2(x + 3)² + 1. If you rewrite it as ax² + bx + c, will the graph be a different parabola or the same one? Write that down before you expand.
      - paragraph [ref=f13e209]: Expand on paper. Enter your b and c (a should stay 2), then submit. Do not copy an expanded line off the graph until after you have tried.
