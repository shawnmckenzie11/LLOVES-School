      - paragraph [ref=f13e389]: How did you read the high or low point from this writing? If you expanded it into ax² + bx + c, would the fountain-shaped curve move?
      - paragraph [ref=f13e390]: "If you are on paper: sketch from the equation, then change one of a, h, or k and sketch again."
      - heading "What the writing gives you" [level=2] [ref=f13e391]
      - paragraph [ref=f13e392]: Vertex form f(x) = a(x - h)² + k makes the vertex (h, k) and the axis x = h readable. Maximum versus minimum comes from the sign of a, not from the sign of k and not from which quadrant the vertex sits in.
      - paragraph [ref=f13e393]: Match the brackets to (x - h). A plus inside the brackets does not mean the vertex is on the positive side of the x-axis.
      - paragraph [ref=f13e394]: a stretches or flips the graph. k moves the vertex up or down. Those two jobs are not the same.
      - paragraph [ref=f13e395]: Expanding vertex form into f(x) = ax² + bx + c gives the same parabola, not a new one. The graphs should land on top of each other.
