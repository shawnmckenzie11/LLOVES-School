    - generic [ref=f4e34]:
      - paragraph [ref=f4e35]: In this course, f(x) = a(x - h)² + k is vertex form. The expanded equation f(x) = ax² + bx + c is standard form.
      - heading "Read the turning point from the equation" [level=2] [ref=f4e36]
      - paragraph [ref=f4e37]: You named a vertex from a plus inside the brackets. Read this next equation the same way — vertex, axis, and whether the turning point is a maximum or a minimum.
      - generic [ref=f4e38]:
        - text: Worked example
        - paragraph [ref=f4e39]: Sketch a parabola that opens downward and turns at a point left of the origin and above the x-axis. Label that turning point. Draw a dashed vertical line through it.
        - paragraph [ref=f4e40]: The equation of that graph is
        - paragraph [ref=f4e41]: y = -3(x + 2)² + 4
        - paragraph [ref=f4e42]: We need the vertex, the axis of symmetry, and whether the vertex is a maximum or a minimum.
        - paragraph [ref=f4e43]: Compare the equation with y = a(x - h)² + k.
        - paragraph [ref=f4e44]: The brackets contain (x + 2). Vertex form uses (x - h), so rewrite x + 2 as x - (-2). That makes h = -2. The constant outside the brackets is +4, so k = 4.
        - paragraph [ref=f4e45]: The vertex is (-2, 4). The axis of symmetry is the vertical line through the vertex, x = -2.
        - paragraph [ref=f4e46]: The coefficient in front of the brackets is -3. Because a is negative, the parabola opens downward, so the vertex is a maximum. The maximum value of the function is 4, and it occurs when x = -2.
        - paragraph [ref=f4e47]: That highest point is the same kind of fact you marked on the water stream, now read from the equation.
      - heading "A second equation, with nothing added outside" [level=2] [ref=f4e48]
      - generic [ref=f4e49]:
        - text: Another example
        - paragraph [ref=f4e50]: The last equation had a constant outside the brackets, so k was easy to see as a height. This Ontario sample includes
        - paragraph [ref=f4e51]: h(x) = -2(x + 1)²
        - paragraph [ref=f4e52]: as one of the graphs to read from f(x) = x². Use it here to inspect vertex form. (The sample also names g(x) = x² - 4; stay with h(x).)
        - paragraph [ref=f4e53]: The brackets contain (x + 1). Rewrite x + 1 as x - (-1), so h = -1. There is no constant added outside, so k = 0. The vertex is (-1, 0), and the axis is x = -1.
        - paragraph [ref=f4e54]: The coefficient is -2, so a is negative and the parabola opens downward. The vertex is a maximum even though k = 0. Maximum versus minimum comes from the sign of a, not from whether k looks positive.
        - paragraph [ref=f4e56]: Could you have decided maximum versus minimum from k on this equation? Say why or why not.
