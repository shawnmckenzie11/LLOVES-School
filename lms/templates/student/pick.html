<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Which section? · {{ school_name }}</title>
  <link rel="stylesheet" href="/static/lloves.css">
  <link rel="stylesheet" href="/static/student-portal.css">
</head>
<body class="student-portal">
  <div class="student-wrap">
    <p class="kicker">More than one section</p>
    <h1>Which class?</h1>
    <p class="sub">Your name is on more than one roster for this code. Pick your days and time.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      {% for cls in classes %}
      <p>
        <button type="submit" name="class_id" value="{{ cls.id }}">
          {{ cls.course_code }} · {{ cls.days }} · {{ cls.time }}
        </button>
      </p>
      {% endfor %}
    </form>
  </div>
  <script src="/static/student-live-session.js"></script>
</body>
</html>
