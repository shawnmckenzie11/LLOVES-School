<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Class</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="live-overlay">
  <div class="live-overlay-stage" id="live-stage">
    <header class="live-overlay-header">
      <p class="live-overlay-code no-drag" id="live-code" title="Click to copy" role="button" tabindex="0">····</p>
      <span class="live-overlay-copy-feedback" id="live-copy-feedback" hidden>Copied</span>
      <p class="live-overlay-round hidden" id="live-round" hidden></p>
      <p class="live-overlay-round-clock hidden" id="live-round-clock" hidden></p>
    </header>
    <section class="live-overlay-anticipation hidden" id="live-anticipation" aria-live="polite" hidden>
      <p class="live-overlay-anticipation-kicker" id="live-anticipation-kicker">Get ready</p>
      <p class="live-overlay-anticipation-title" id="live-anticipation-title">Rounds incoming</p>
      <div class="live-overlay-anticipation-pulse" aria-hidden="true"></div>
      <p class="live-overlay-anticipation-clock" id="live-anticipation-clock"></p>
    </section>
    <section class="live-overlay-celebrate hidden" id="live-celebrate" aria-live="polite" hidden>
      <div class="live-overlay-confetti" id="live-confetti" aria-hidden="true"></div>
      <p class="live-overlay-celebrate-kicker">Winner</p>
      <h2 class="live-overlay-celebrate-team" id="live-celebrate-team"></h2>
      <ul class="live-overlay-celebrate-members" id="live-celebrate-members"></ul>
    </section>
    <section class="live-overlay-roster" aria-label="Logged-in students">
      <h2 class="live-overlay-section-title" id="live-roster-title">Participants <span class="live-overlay-att-count" id="live-count">(0)</span></h2>
      <div class="live-overlay-roster-body" id="live-roster-body">
        <ul class="live-overlay-list" id="live-roster"></ul>
      </div>
      <p class="live-overlay-empty" id="live-empty">Waiting for students…</p>
    </section>
    <section class="live-overlay-teams hidden" id="live-teams" aria-label="Team scores" hidden>
      <h2 class="live-overlay-section-title">Scores</h2>
      <div class="live-overlay-team-board" id="live-team-board"></div>
    </section>
    <p class="live-overlay-ended hidden" id="live-ended" hidden>Session ended</p>
  </div>
  <script type="module" src="/static/live_session_overlay.js"></script>
</body>
</html>
