<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="72" height="72" role="img" aria-label="Frog in a tiny crown">
  <title>Frog in a tiny crown</title>
  <!-- eye bumps -->
  <circle cx="10.5" cy="13" r="5.2" fill="#5cc46a"/>
  <circle cx="25.5" cy="13" r="5.2" fill="#5cc46a"/>
  <!-- head -->
  <path d="M18 12.5 C27.5 12.5 33 17 33 22.5 C33 28.5 26.5 32 18 32 C9.5 32 3 28.5 3 22.5 C3 17 8.5 12.5 18 12.5 Z" fill="#5cc46a"/>
  <!-- belly / chin -->
  <path d="M9.5 27 C12 30.2 24 30.2 26.5 27 C25.5 30.6 22 32 18 32 C14 32 10.5 30.6 9.5 27 Z" fill="#c8f0c4"/>
  <!-- eyes -->
  <circle cx="10.5" cy="12.6" r="3" fill="#f4f6fb"/>
  <circle cx="25.5" cy="12.6" r="3" fill="#f4f6fb"/>
  <circle cx="10.9" cy="13" r="1.6" fill="#1f2937"/>
  <circle cx="25.1" cy="13" r="1.6" fill="#1f2937"/>
  <!-- smile + cheeks -->
