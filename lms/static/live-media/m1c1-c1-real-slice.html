<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C1 Real-slice · y = ax² + bx + c</title>
  <style>
    :root {
      --bg: #070b14;
      --ink: #e8eef8;
      --muted: #8fa3bb;
      --gold: #f5c518;
      --gold-deep: #c49212;
      --panel: rgba(10, 18, 32, 0.86);
      --line: rgba(245, 197, 24, 0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.7rem 0.85rem calc(0.7rem + env(safe-area-inset-bottom, 0px));
    }
    .eq {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.45rem 0.7rem;
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: clamp(0.95rem, 2.6vw, 1.25rem);
      letter-spacing: 0.01em;
    }
    .eq strong { color: var(--gold); font-weight: 650; }
    .eq .coeffs { color: #d6deef; font-size: 0.82em; }
    .eq[hidden], .chip[hidden] { display: none !important; }
    .chip {
      align-self: flex-start;
      margin-top: 0.4rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.28rem 0.75rem;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    .dock {
      pointer-events: auto;
      align-self: stretch;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.65rem 0.75rem 0.75rem;
      display: none;
      gap: 0.45rem;
    }
    .dock.is-on { display: grid; }
    .dock h2 {
      margin: 0 0 0.15rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
    }
    .sliders {
      display: grid;
      gap: 0.35rem;
    }
    label.slide {
      display: grid;
      grid-template-columns: 1.4rem 1fr 2.6rem;
      gap: 0.45rem;
      align-items: center;
      font-size: 0.82rem;
      color: #c5d0dc;
    }
    label.slide span { font-family: "IBM Plex Serif", Georgia, serif; color: var(--gold); }
    label.slide output {
      font-family: ui-monospace, "IBM Plex Mono", monospace;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--gold);
    }
    .teacher-grid {
      display: none;
      grid-template-columns: minmax(9.2rem, 1.15fr) minmax(8.2rem, 1.35fr) minmax(7.2rem, 1fr) minmax(6.4rem, 0.85fr);
      gap: 0.4rem 0.5rem;
      align-items: center;
      margin-top: 0.35rem;
      padding: 0.35rem;
      border: 1px solid transparent;
    }
    .teacher-grid.is-on { display: grid; }
    .teacher-grid .cell {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-width: 0;
      min-height: 1.7rem;
      padding: 0.12rem 0.2rem;
      border: 1px solid transparent;
    }
    .teacher-grid .cell.check label {
      display: flex;
      align-items: center;
      gap: 0.32rem;
      font-size: 0.72rem;
      line-height: 1.2;
      color: #c5d0dc;
      cursor: pointer;
    }
    .teacher-grid .cell.check input[type="checkbox"] {
      flex: 0 0 auto;
      margin: 0;
    }
    .teacher-grid .cell.check label:has(input:disabled) {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .teacher-grid .cell.tool {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) 2.1rem;
      gap: 0.28rem;
      align-items: center;
      font-size: 0.7rem;
      color: #c5d0dc;
    }
    .teacher-grid .cell.tool span {
      white-space: nowrap;
      color: var(--gold);
    }
    .teacher-grid .cell.tool output {
      font-family: ui-monospace, "IBM Plex Mono", monospace;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Real-slice parabola in 3D space"></canvas>
  <div class="hud">
    <div>
      <p class="eq" id="eq" hidden>y = <strong>x²</strong></p>
      <p class="chip" id="chip">From this view only — what must be true?</p>
    </div>
    <section class="dock" id="dock">
      <h2 id="dock-title">Teacher controls</h2>
      <div class="sliders">
        <label class="slide"> <span>a</span>
          <input id="p-a" type="range" min="-2.5" max="2.5" step="0.05" value="1">
          <output id="o-a">1.00</output>
        </label>
        <label class="slide"> <span>b</span>
          <input id="p-b" type="range" min="-4" max="4" step="0.05" value="0">
          <output id="o-b">0.00</output>
        </label>
        <label class="slide"> <span>c</span>
          <input id="p-c" type="range" min="-3" max="3" step="0.05" value="0">
          <output id="o-c">0.00</output>
        </label>
      </div>
      <div class="teacher-grid" id="teacher-grid">
        <div class="cell check">
          <label for="t-unlock"><input id="t-unlock" type="checkbox"> Show student view a, b, c</label>
        </div>
        <label class="cell tool" for="t-zoom">
          <span>Student zoom</span>
          <input id="t-zoom" type="range" min="0" max="10" step="0.1" value="0">
          <output id="o-zoom">0.0</output>
        </label>
        <div class="cell check">
          <label for="t-freeze-zoom"><input id="t-freeze-zoom" type="checkbox"> Freeze zoom</label>
        </div>
        <div class="cell check">
          <label for="t-cons-1"><input id="t-cons-1" type="checkbox" disabled title="Next: CONS-1 when conditions are met"> Show CONS</label>
        </div>
        <div class="cell check">
          <label for="t-zaxis"><input id="t-zaxis" type="checkbox"> Show z axis</label>
        </div>
        <label class="cell tool" for="t-surface">
          <span>3D surface transparency</span>
          <input id="t-surface" type="range" min="0" max="10" step="0.1" value="1.5">
          <output id="o-surface">1.5</output>
        </label>
        <div class="cell check">
          <label for="t-freeze-surface"><input id="t-freeze-surface" type="checkbox"> Freeze 3D surface</label>
        </div>
        <div class="cell check">
          <label for="t-cons-2"><input id="t-cons-2" type="checkbox" disabled title="Next: CONS-1 when conditions are met"> Show CONS</label>
        </div>
        <div class="cell check">
          <label for="t-lateral"><input id="t-lateral" type="checkbox"> In-pane lateral reveal</label>
        </div>
        <label class="cell tool" for="t-yaw">
          <span>Student yaw range</span>
          <input id="t-yaw" type="range" min="0" max="360" step="1" value="0">
          <output id="o-yaw">0</output>
        </label>
        <div class="cell check">
          <label for="t-freeze-yaw"><input id="t-freeze-yaw" type="checkbox"> Freeze student yaw</label>
        </div>
        <div class="cell check">
          <label for="t-cons-3"><input id="t-cons-3" type="checkbox" disabled title="Next: CONS-1 when conditions are met"> Show CONS</label>
        </div>
      </div>
    </section>
  </div>
  <script>
(function () {
  const GOLD = "#f5c518";
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const eqEl = document.getElementById("eq");
  const chipEl = document.getElementById("chip");
  const dock = document.getElementById("dock");
  const dockTitle = document.getElementById("dock-title");
  const teacherGrid = document.getElementById("teacher-grid");
  const inputA = document.getElementById("p-a");
  const inputB = document.getElementById("p-b");
  const inputC = document.getElementById("p-c");
  const outA = document.getElementById("o-a");
  const outB = document.getElementById("o-b");
  const outC = document.getElementById("o-c");
  const tUnlock = document.getElementById("t-unlock");
  const tZoom = document.getElementById("t-zoom");
  const oZoom = document.getElementById("o-zoom");
  const tFreezeZoom = document.getElementById("t-freeze-zoom");
  const tZaxis = document.getElementById("t-zaxis");
  const tSurface = document.getElementById("t-surface");
  const oSurface = document.getElementById("o-surface");
  const tFreezeSurface = document.getElementById("t-freeze-surface");
  const tLateral = document.getElementById("t-lateral");
  const tYaw = document.getElementById("t-yaw");
  const oYaw = document.getElementById("o-yaw");
  const tFreezeYaw = document.getElementById("t-freeze-yaw");

  const query = new URLSearchParams(location.search);
  const embedded = window.parent !== window;
  const teacherMode = query.get("role") === "teacher" || !embedded;

  const PAPER_YAW = 0.08;
  const PAPER_PITCH = -0.16;
  /**
   * Lateral pose keeps the gold curve a parabola in projection.
   * Slice is z = 0, so screen width scales with cos(yaw). 90° collapses
   * the U to a line; ~38° (0.66 rad) keeps ~79% of face-on width while
   * the saddle’s t-extent reads as a slice. Pitch −0.30 looks slightly down.
   */
  const LATERAL_YAW = 0.66;
  const LATERAL_PITCH = -0.30;
  const PAPER_DIST = 9.2;
  const CLOSE_DIST = 3.6;
  const LATERAL_CHIP = "This picture was always a slice";
  const ENTRY_SURFACE = 1.5;

  const state = {
    a: 1,
    b: 0,
    c: 0,
    yaw: PAPER_YAW,
    pitch: PAPER_PITCH,
    targetYaw: PAPER_YAW,
    targetPitch: PAPER_PITCH,
    dist: PAPER_DIST,
    showZAxis: false,
    studentZoom: 0,
    freezeZoom: false,
    surfaceTransparency: ENTRY_SURFACE,
    freezeSurface: false,
    studentYawRange: 0,
    freezeYaw: false,
    revealAxes: false,
    revealLateral: false,
    studentNudged: false,
    unlocked: false,
    dragging: false,
    lastX: 0,
    lastY: 0,
    acceptParentParams: true,
  };
  let cameraRaf = 0;

  /**
   * Height of the real-part saddle: Re(a z^2 + b z + c) with z = x + i t.
   * @param {number} x
   * @param {number} t
   * @returns {number}
   */
  function height(x, t) {
    return state.a * (x * x - t * t) + state.b * x + state.c;
  }

  /**
   * @param {number} n
   * @param {number} [digits]
   */
  function fmt(n, digits) {
    const v = Math.round(n * 100) / 100;
    return v.toFixed(digits == null ? 2 : digits);
  }

  /**
   * Camera distance: zoom 0 is paper-locked, 10 is full zoom-in.
   * @returns {number}
   */
  function distFromZoom() {
    const t = Math.max(0, Math.min(10, state.studentZoom)) / 10;
    return PAPER_DIST + (CLOSE_DIST - PAPER_DIST) * t;
  }

  /**
   * Saddle fill alpha: 0 is very faint, 10 is solid.
   * @returns {number}
   */
  function surfaceAlpha() {
    const t = Math.max(0, Math.min(10, state.surfaceTransparency)) / 10;
    return 0.045 + t * 0.58;
  }

  /**
   * Half-span of allowed student yaw after lateral, in radians.
   * @returns {number}
   */
  function yawSpanRad() {
    return (Math.max(0, Math.min(360, state.studentYawRange)) / 2) * Math.PI / 180;
  }

  /**
   * Pretty-print y = ax^2 + bx + c for the HUD.
   * @returns {string}
   */
  function equationHtml() {
    const parts = [];
    const a = state.a;
    const b = state.b;
    const c = state.c;
    if (Math.abs(a - 1) < 0.001) parts.push("x²");
    else if (Math.abs(a + 1) < 0.001) parts.push("−x²");
    else parts.push(fmt(a) + "x²");
    if (Math.abs(b) > 0.001) {
      parts.push((b < 0 ? " − " : " + ") + (Math.abs(Math.abs(b) - 1) < 0.001 ? "" : fmt(Math.abs(b))) + "x");
    }
    if (Math.abs(c) > 0.001) {
      parts.push((c < 0 ? " − " : " + ") + fmt(Math.abs(c)));
    }
    return "y = <strong>" + parts.join("") + "</strong> <span class='coeffs'>a=" + fmt(a) + " · b=" + fmt(b) + " · c=" + fmt(c) + "</span>";
  }

  function syncOutputs() {
    inputA.value = String(state.a);
    inputB.value = String(state.b);
    inputC.value = String(state.c);
    outA.textContent = fmt(state.a);
    outB.textContent = fmt(state.b);
    outC.textContent = fmt(state.c);
    tUnlock.checked = state.unlocked;
    tZoom.value = String(state.studentZoom);
    oZoom.textContent = fmt(state.studentZoom, 1);
    tFreezeZoom.checked = state.freezeZoom;
    tZoom.disabled = state.freezeZoom;
    tZaxis.checked = state.showZAxis;
    tSurface.value = String(state.surfaceTransparency);
    oSurface.textContent = fmt(state.surfaceTransparency, 1);
    tFreezeSurface.checked = state.freezeSurface;
    tSurface.disabled = state.freezeSurface;
    tLateral.checked = state.revealLateral;
    tYaw.value = String(state.studentYawRange);
    oYaw.textContent = String(Math.round(state.studentYawRange));
    tFreezeYaw.checked = state.freezeYaw;
    tYaw.disabled = state.freezeYaw;
    state.dist = distFromZoom();
    eqEl.innerHTML = equationHtml();
    const showEq = teacherMode || state.revealAxes;
    eqEl.hidden = !showEq;
    if (chipEl) {
      if (!teacherMode && state.revealLateral) {
        chipEl.hidden = false;
        if (!chipEl.textContent.trim()) chipEl.textContent = LATERAL_CHIP;
      } else {
        chipEl.hidden = teacherMode || state.revealAxes || state.unlocked;
      }
    }
  }

  /**
   * Student entry: paper-locked, chip on, equation off, faint saddle, x/y on.
   * Teacher dock holds a/b/c plus the view-tool grid. Explore a,b,c is sliders only.
   */
  function applyRoleChrome() {
    const showDock = teacherMode || state.unlocked;
    dock.classList.toggle("is-on", showDock);
    dockTitle.textContent = teacherMode ? "Teacher controls" : "Explore a, b, and c";
    teacherGrid.classList.toggle("is-on", teacherMode);
    if (teacherMode) {
      canvas.style.cursor = "grab";
    } else if (studentLimitedYaw()) {
      canvas.style.cursor = "ew-resize";
    } else {
      canvas.style.cursor = "default";
    }
  }

  /**
   * True when the student may yaw around the lateral pose.
   * @returns {boolean}
   */
  function studentLimitedYaw() {
    return !teacherMode && state.revealLateral && state.studentYawRange > 0;
  }

  /**
   * Point cameras at paper or lateral pose. Teacher may orbit after the peel.
   * @param {boolean} [forcePose]
   */
  function syncCameraTargets(forcePose) {
    if (teacherMode && !forcePose) return;
    if (state.revealLateral) {
      state.targetPitch = LATERAL_PITCH;
      if (teacherMode || !studentLimitedYaw() || !state.studentNudged) {
        state.targetYaw = LATERAL_YAW;
      }
    } else {
      state.studentNudged = false;
      state.targetYaw = PAPER_YAW;
      state.targetPitch = PAPER_PITCH;
    }
    kickCamera();
  }

  /**
   * Ease yaw/pitch toward targets when not dragging.
   */
  function tickCamera() {
    cameraRaf = 0;
    if (state.dragging) return;
    const dy = state.targetYaw - state.yaw;
    const dp = state.targetPitch - state.pitch;
    if (Math.abs(dy) < 0.002 && Math.abs(dp) < 0.002) {
      state.yaw = state.targetYaw;
      state.pitch = state.targetPitch;
      draw();
      return;
    }
    state.yaw += dy * 0.14;
    state.pitch += dp * 0.14;
    draw();
    cameraRaf = window.requestAnimationFrame(tickCamera);
  }

  /**
   * Start the camera ease if it is not already running.
   */
  function kickCamera() {
    if (!cameraRaf) cameraRaf = window.requestAnimationFrame(tickCamera);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    canvas.width = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /**
   * @param {{x:number,y:number,z:number}} p
   * @returns {{x:number,y:number,z:number}}
   */
  function worldToView(p) {
    const cy = Math.cos(state.yaw);
    const sy = Math.sin(state.yaw);
    const cp = Math.cos(state.pitch);
    const sp = Math.sin(state.pitch);
    let x = p.x * cy - p.z * sy;
    let z = p.x * sy + p.z * cy;
    const y1 = p.y * cp - z * sp;
    z = p.y * sp + z * cp;
    return { x: x, y: y1, z: z };
  }

  /**
   * @param {{x:number,y:number,z:number}} p
   * @param {number} w
   * @param {number} h
   */
  function project(p, w, h) {
    const v = worldToView(p);
    const depth = v.z + state.dist;
    const scale = Math.min(w, h) * 0.42 / Math.max(0.6, depth * 0.22);
    return {
      x: w / 2 + v.x * scale,
      y: h / 2 - v.y * scale,
      z: v.z,
      depth: depth,
    };
  }

  /**
   * @param {{x:number,y:number,z:number}} a
   * @param {{x:number,y:number,z:number}} b
   * @param {{x:number,y:number,z:number}} cpt
   */
  function normal(a, b, cpt) {
    const ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z;
    const vx = cpt.x - a.x, vy = cpt.y - a.y, vz = cpt.z - a.z;
    const nx = uy * vz - uz * vy;
    const ny = uz * vx - ux * vz;
    const nz = ux * vy - uy * vx;
    const mag = Math.hypot(nx, ny, nz) || 1;
    return { x: nx / mag, y: ny / mag, z: nz / mag };
  }

  function draw() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w * 0.5, h * 0.42, 20, w * 0.5, h * 0.5, Math.max(w, h) * 0.7);
    g.addColorStop(0, "#122038");
    g.addColorStop(1, "#070b14");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    const faces = [];
    const span = 2.4;
    const steps = 18;
    const step = (span * 2) / steps;
    const alpha = surfaceAlpha();
    const strokeA = Math.min(0.22, alpha * 0.55);

    for (let i = 0; i < steps; i += 1) {
      for (let j = 0; j < steps; j += 1) {
        const x0 = -span + i * step;
        const z0 = -span + j * step;
        const x1 = x0 + step;
        const z1 = z0 + step;
        const p00 = { x: x0, y: height(x0, z0), z: z0 };
        const p10 = { x: x1, y: height(x1, z0), z: z0 };
        const p11 = { x: x1, y: height(x1, z1), z: z1 };
        const p01 = { x: x0, y: height(x0, z1), z: z1 };
        const n = normal(p00, p10, p01);
        const lit = Math.max(0.18, 0.35 + 0.75 * (n.x * 0.25 + n.y * 0.9 + n.z * 0.35));
        const mid = project(
          { x: (x0 + x1) / 2, y: (p00.y + p11.y) / 2, z: (z0 + z1) / 2 },
          w,
          h
        );
        faces.push({
          depth: mid.depth,
          pts: [p00, p10, p11, p01].map((p) => project(p, w, h)),
          fill: "rgba(" +
            Math.round(40 + lit * 70) + "," +
            Math.round(70 + lit * 90) + "," +
            Math.round(110 + lit * 90) + "," + alpha + ")",
          stroke: "rgba(160, 200, 230, " + strokeA + ")",
        });
      }
    }

    faces.sort((left, right) => right.depth - left.depth);
    for (const face of faces) {
      ctx.beginPath();
      ctx.moveTo(face.pts[0].x, face.pts[0].y);
      for (let i = 1; i < face.pts.length; i += 1) ctx.lineTo(face.pts[i].x, face.pts[i].y);
      ctx.closePath();
      ctx.fillStyle = face.fill;
      ctx.fill();
      ctx.strokeStyle = face.stroke;
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }

    const axis = (from, to, color, label, width) => {
      const a = project(from, w, h);
      const b = project(to, w, h);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
      if (label) {
        ctx.fillStyle = color;
        ctx.font = "12px 'IBM Plex Sans', sans-serif";
        ctx.fillText(label, b.x + 4, b.y - 4);
      }
    };
    axis({ x: -span, y: 0, z: 0 }, { x: span + 0.15, y: 0, z: 0 }, "rgba(210,220,235,0.92)", "x", 1.85);
    axis({ x: 0, y: -2.2, z: 0 }, { x: 0, y: 3.1, z: 0 }, "rgba(210,220,235,0.92)", "y", 1.85);
    if (state.showZAxis) {
      axis({ x: 0, y: 0, z: -span }, { x: 0, y: 0, z: span + 0.15 }, "rgba(210,220,235,0.55)", "z", 1.5);
    }

    if (teacherMode || state.revealAxes) {
      ctx.beginPath();
      const gridN = 8;
      for (let i = 0; i <= gridN; i += 1) {
        const t = -span + (i / gridN) * span * 2;
        const a = project({ x: t, y: 0, z: -span }, w, h);
        const b = project({ x: t, y: 0, z: span }, w, h);
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        const c0 = project({ x: -span, y: 0, z: t }, w, h);
        const c1 = project({ x: span, y: 0, z: t }, w, h);
        ctx.moveTo(c0.x, c0.y);
        ctx.lineTo(c1.x, c1.y);
      }
      ctx.strokeStyle = "rgba(180, 198, 220, 0.16)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    const pts = [];
    for (let i = 0; i <= 80; i += 1) {
      const x = -span + (i / 80) * span * 2;
      pts.push(project({ x: x, y: height(x, 0), z: 0 }, w, h));
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i += 1) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = "rgba(245, 197, 24, 0.25)";
    ctx.lineWidth = 10;
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i += 1) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = 3.2;
    ctx.stroke();
  }

  /**
   * Push teacher tools + a/b/c to the parent so both iframes stay in lockstep.
   */
  function notifyParent() {
    if (!embedded) return;
    try {
      window.parent.postMessage(
        {
          source: "lloves-m1c1-c1",
          type: "params",
          params: { a: state.a, b: state.b, c: state.c },
          student_controls_unlocked: state.unlocked,
          reveal_axes: state.revealAxes,
          reveal_lateral: state.revealLateral,
          allow_3d_limited: state.studentYawRange > 0,
          show_z_axis: state.showZAxis,
          student_zoom: state.studentZoom,
          freeze_zoom: state.freezeZoom,
          surface_transparency: state.surfaceTransparency,
          freeze_surface: state.freezeSurface,
          student_yaw_range: state.studentYawRange,
          freeze_yaw: state.freezeYaw,
        },
        window.location.origin
      );
    } catch (_err) {
      /* ignore */
    }
  }

  /**
   * Read a/b/c and teacher view tools from the dock.
   * @param {boolean} fromTeacher
   */
  function readSliders(fromTeacher) {
    state.a = Number(inputA.value);
    state.b = Number(inputB.value);
    state.c = Number(inputC.value);
    if (teacherMode) {
      const nextLateral = tLateral.checked;
      const lateralEdge = nextLateral !== state.revealLateral;
      state.unlocked = tUnlock.checked;
      state.showZAxis = tZaxis.checked;
      if (!state.freezeZoom) state.studentZoom = Number(tZoom.value);
      state.freezeZoom = tFreezeZoom.checked;
      if (!state.freezeSurface) state.surfaceTransparency = Number(tSurface.value);
      state.freezeSurface = tFreezeSurface.checked;
      if (!state.freezeYaw) state.studentYawRange = Number(tYaw.value);
      state.freezeYaw = tFreezeYaw.checked;
      state.revealLateral = nextLateral;
      if (lateralEdge) {
        state.studentNudged = false;
        syncCameraTargets(true);
      }
    }
    if (fromTeacher) state.acceptParentParams = true;
    if (!teacherMode) state.acceptParentParams = false;
    syncOutputs();
    draw();
    notifyParent();
  }

  ["input", "change"].forEach((evt) => {
    inputA.addEventListener(evt, () => readSliders(teacherMode));
    inputB.addEventListener(evt, () => readSliders(teacherMode));
    inputC.addEventListener(evt, () => readSliders(teacherMode));
    [tUnlock, tZoom, tFreezeZoom, tZaxis, tSurface, tFreezeSurface, tLateral, tYaw, tFreezeYaw].forEach((el) => {
      el.addEventListener(evt, () => readSliders(true));
    });
  });

  canvas.addEventListener("pointerdown", (event) => {
    if (!(teacherMode || studentLimitedYaw())) return;
    state.dragging = true;
    state.lastX = event.clientX;
    state.lastY = event.clientY;
    canvas.setPointerCapture(event.pointerId);
    canvas.style.cursor = teacherMode ? "grabbing" : "ew-resize";
  });
  canvas.addEventListener("pointermove", (event) => {
    if (!state.dragging) return;
    const dx = event.clientX - state.lastX;
    const dy = event.clientY - state.lastY;
    state.lastX = event.clientX;
    state.lastY = event.clientY;
    if (teacherMode) {
      state.yaw += dx * 0.008;
      state.pitch = Math.max(-1.15, Math.min(0.55, state.pitch + dy * 0.008));
    } else if (studentLimitedYaw()) {
      const next = state.yaw + dx * 0.006;
      const span = yawSpanRad();
      if (span >= Math.PI) {
        state.yaw = next;
      } else {
        state.yaw = Math.max(LATERAL_YAW - span, Math.min(LATERAL_YAW + span, next));
      }
      state.targetYaw = state.yaw;
      state.studentNudged = true;
    }
    draw();
  });
  const endDrag = (event) => {
    if (!(teacherMode || studentLimitedYaw())) return;
    state.dragging = false;
    canvas.style.cursor = teacherMode ? "grab" : (studentLimitedYaw() ? "ew-resize" : "default");
    try { canvas.releasePointerCapture(event.pointerId); } catch (_err) { /* ignore */ }
  };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  window.addEventListener("message", (event) => {
    if (event.origin !== window.location.origin) return;
    const data = event.data;
    if (!data || data.type !== "live-media-state") return;
    if (data.source !== "lloves-student-home" && data.source !== "lloves-staff-live") return;
    if (typeof data.student_controls_unlocked === "boolean") {
      state.unlocked = data.student_controls_unlocked;
    }
    if (typeof data.reveal_axes === "boolean") {
      state.revealAxes = data.reveal_axes;
    }
    let poseEdge = false;
    if (typeof data.reveal_lateral === "boolean") {
      if (data.reveal_lateral !== state.revealLateral) {
        state.studentNudged = false;
        poseEdge = true;
      }
      state.revealLateral = data.reveal_lateral;
    } else if (data.unlock_flags && typeof data.unlock_flags.L4 === "boolean") {
      if (data.unlock_flags.L4 !== state.revealLateral) {
        state.studentNudged = false;
        poseEdge = true;
      }
      state.revealLateral = data.unlock_flags.L4;
    }
    if (typeof data.show_z_axis === "boolean") state.showZAxis = data.show_z_axis;
    if (Number.isFinite(Number(data.student_zoom))) {
      state.studentZoom = Number(data.student_zoom);
    }
    if (typeof data.freeze_zoom === "boolean") state.freezeZoom = data.freeze_zoom;
    if (Number.isFinite(Number(data.surface_transparency))) {
      state.surfaceTransparency = Number(data.surface_transparency);
    }
    if (typeof data.freeze_surface === "boolean") state.freezeSurface = data.freeze_surface;
    if (Number.isFinite(Number(data.student_yaw_range))) {
      state.studentYawRange = Number(data.student_yaw_range);
    } else if (typeof data.allow_3d_limited === "boolean") {
      if (data.allow_3d_limited && state.studentYawRange <= 0) state.studentYawRange = 44;
      if (!data.allow_3d_limited) state.studentYawRange = 0;
    }
    if (typeof data.freeze_yaw === "boolean") state.freezeYaw = data.freeze_yaw;
    if (chipEl && typeof data.entry_chip === "string" && data.entry_chip.trim()) {
      chipEl.textContent = data.entry_chip.trim();
    } else if (chipEl && state.revealLateral && !teacherMode) {
      chipEl.textContent = LATERAL_CHIP;
    }
    const ignoreParams = !teacherMode && state.unlocked && !state.acceptParentParams;
    const params = data.params || {};
    if (!ignoreParams) {
      if (Number.isFinite(Number(params.a))) state.a = Number(params.a);
      if (Number.isFinite(Number(params.b))) state.b = Number(params.b);
      if (Number.isFinite(Number(params.c))) state.c = Number(params.c);
    }
    if (!teacherMode && !state.unlocked) state.acceptParentParams = true;
    syncCameraTargets(poseEdge);
    applyRoleChrome();
    syncOutputs();
    draw();
  });

  window.addEventListener("resize", () => {
    resize();
    draw();
  });

  applyRoleChrome();
  syncOutputs();
  resize();
  draw();
})();
  </script>
</body>
</html>
