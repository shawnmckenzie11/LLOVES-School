- generic [active] [ref=f4e1]: "/** * Join-screen emoji avatars shown on the live overlay and staff lists. * Mood check-in faces stay in mood_faces.js and are not used as public icons. */ const AVATAR_GLYPHS = { fox: \"🦊\", panda: \"🐼\", unicorn: \"🦄\", octopus: \"🐙\", dragon: \"🐲\", owl: \"🦉\", }; /** * Compact emoji for a stored avatar key. * @param {string|null|undefined} character * @returns {string} */ export function avatarGlyph(character) { const key = String(character || \"\").trim(); return AVATAR_GLYPHS[key] || \"\"; } /** * Avatar key from a student or attendee row. * @param {{character?: string|null, character_key?: string|null}|null|undefined} row * @returns {string} */ export function avatarKey(row) { if (!row || typeof row !== \"object\") return \"\"; return String(row.character || row.character_key || \"\").trim(); } /** * Escape text for HTML. * @param {unknown} value * @returns {string} */ function escapeHtml(value) { return String(value ?? \"\") .replaceAll(\"&\", \"&amp;\") .replaceAll(\"<\", \"&lt;\") .replaceAll(\">\", \"&gt;\") .replaceAll('\"', \"&quot;\"); } /** * Avatar emoji next to a roster name. * @param {string} name * @param {string|null|undefined} character * @returns {string} HTML */ export function nameWithAvatar(name, character) { const label = String(name || \"\").trim(); const face = avatarGlyph(character); if (!face) return escapeHtml(label); return `<span class=\"avatar-next-name\">${face} ${escapeHtml(label)}</span>`; }"