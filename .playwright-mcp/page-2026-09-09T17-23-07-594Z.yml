        - paragraph [ref=e219]: Rewrite
        - paragraph [ref=e220]: g(x) = (1)/(2)(x + 2)² - 3
        - paragraph [ref=e221]: in standard form, meaning g(x) = ax² + bx + c. Then check two x-values in both forms.
        - paragraph [ref=e222]: "Square the binomial: (x + 2)² = x² + 4x + 4."
        - paragraph [ref=e223]: "Multiply by a = (1)/(2): (1)/(2)x² + 2x + 2."
        - paragraph [ref=e224]: "Add k = -3: (1)/(2)x² + 2x - 1."
        - paragraph [ref=e225]: g(x) = (1)/(2)x² + 2x - 1
        - paragraph [ref=e226]: "At x = -2, both forms give -3. At x = 0, both give -1. Those table points sit on the same graph: expanding did not make a new parabola."
