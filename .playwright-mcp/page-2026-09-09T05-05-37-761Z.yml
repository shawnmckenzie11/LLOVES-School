  - tabpanel "Action" [ref=f6e19]:
    - generic [ref=f6e20]:
      - paragraph [ref=f6e21]: "First you will follow a worked reading of one vertex-form equation. Then you will use the graph tool: check the vertex you named, predict what a single slider will do, move that slider, and explain what changed. After that, two practice questions — one about what this writing is for, and one where you expand vertex form and compare graphs."
      - paragraph [ref=f6e22]: In this course, f(x) = a(x − h)^2 + k is vertex form. The expanded writing f(x) = ax^2 + bx + c is standard form. Some other books swap those names; we will not.
    - heading "Guided example" [level=2] [ref=f6e23]
    - generic [ref=f6e24]:
      - paragraph [ref=f6e25]: The equation is
      - paragraph [ref=f6e26]: y = −3(x + 2)^2 + 4
      - paragraph [ref=f6e27]: Name the vertex, say whether the graph has a maximum or a minimum, and say how you knew.
      - paragraph [ref=f6e28]: Worked reading (OpenStax College Algebra 2e, §5.1, Figure 5 paragraph, CC BY-NC-SA 4.0). Some books call this writing “standard form.” In this course it is vertex form.
      - paragraph [ref=f6e29]: Since x − h = x + 2 in this example, h = −2. In this form, a = −3, h = −2, and k = 4. Because a is negative, the parabola opens downward. The vertex is at (−2, 4).
      - paragraph [ref=f6e30]: That vertex is a maximum.
      - paragraph [ref=f6e31]: "Source: https://openstax.org/books/college-algebra-2e/pages/5-1-quadratic-functions"
    - heading "Graph tool" [level=2] [ref=f6e32]
    - generic [ref=f6e33]:
      - paragraph [ref=f6e34]: The graph tool is the local board (parabola, vertex marker labelled (h, k), dashed axis of symmetry, live vertex-form equation, the same function expanded as ax^2 + bx + c, and a short table of shared points). It is not a required GeoGebra page.
      - paragraph [ref=f6e35]: Check your Minds On prediction. Set the sliders so the live equation is f(x) = (x + 3)^2 + 1. Does the vertex marker match the point you named?
      - paragraph [ref=f6e36]: Return to the starting equation f(x) = 2(x + 3)^2 + 1.
      - paragraph [ref=f6e37]: "Prediction. Before you move a slider, look at the equation. Where is the vertex? What is the axis of symmetry? Is this a maximum or a minimum? Then predict: if you change only h, what will happen to the graph and to the equation?"
      - paragraph [ref=f6e38]: Action. Move exactly one slider — start with h. Watch the live equation, the vertex marker, and the dashed axis. You may later repeat with only a, or only k.
      - paragraph [ref=f6e39]: Interpretation. After you moved one slider, compare the graph and the equation. What changed? What stayed the same? How can you read the new vertex from the equation? Does the expanded form show a different parabola, or the same one?
      - paragraph [ref=f6e40]: "If the graph tool is not available: On paper, use f(x) = 2(x + 3)^2 + 1. Name the vertex, the axis, and whether this is a maximum or a minimum, then sketch. Change only h to 2, rewrite the equation, and sketch again. Expand the starting equation and check that a few table points still sit on the same sketch."
